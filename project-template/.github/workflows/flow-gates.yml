name: flow-gates

# Thin caller — the gate logic lives in canonical (CandidDan/flow) as a reusable workflow,
# adopted here by reference instead of copied. Pinned to a tag for stability; bump the tag to
# adopt a new Flow version (the flow-doctor drift check warns when this repo falls behind).
# See docs/flow-reusable-workflows.md in the flow repo.

on:
  pull_request:
    # `ready_for_review` because the reusable skips drafts: the event that matters is the PR
    # leaving draft, and it is not one of the default types (flow-0136).
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  workflow_dispatch:

# A newer push to a PR cancels the run it supersedes (flow-0136). Pull requests only: a manual run
# (`workflow_dispatch`) is never cancelled.
concurrency:
  group: flow-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flow-gates:
    uses: CandidDan/flow/.github/workflows/_flow-gates.yml@v5
    with:
      runner: ${{ vars.FLOW_RUNNER || 'ubuntu-latest' }}
    # Node 22 is the default. Non-Node stack? Pass setup_node_version: "" and provision the
    # toolchain inside the .flow/config.yml commands:
    # with:
    #   setup_node_version: ""

  # The three Definition-of-Done review checks (qa, code-review, security), started only once the
  # gate above has passed (flow-0217). A gate that fails, or is cancelled by a newer push, starts
  # no reviewer, so the review is never billed for a commit the gate already rejected. Until 5.0
  # this was a workflow of its own, flow-review.yml, that started at the same moment as the gate.
  #
  # The job is named `flow-review` so the checks keep their names: `flow-review / qa`,
  # `flow-review / code-review` and `flow-review / security`. Branch protection does not change.
  #
  # The reusable skips every reviewer on a draft, on a fork PR, and unless repo variable FLOW_AI
  # is 'true' with the CLAUDE_CODE_OAUTH_TOKEN secret set. Once enabled, make the three checks
  # REQUIRED in branch protection: a blocking gate that nothing enforces is the failure mode
  # flow-0007 exists to remove. The reviewer model and the security trigger paths are DATA, in
  # .flow/config.yml under `review:`.
  flow-review:
    needs: flow-gates
    if: ${{ github.event_name == 'pull_request' }}
    # id-token: write must be granted here — OIDC is never in the default GITHUB_TOKEN, and a
    # reusable workflow can't raise it above the caller's grant. A permissions block is
    # exhaustive, so contents/pull-requests/issues are re-listed.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: CandidDan/flow/.github/workflows/_flow-review.yml@v5
    with:
      runner: ${{ vars.FLOW_RUNNER || 'ubuntu-latest' }}
    # Named, not `inherit` — the reusable declares only CLAUDE_CODE_OAUTH_TOKEN.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
