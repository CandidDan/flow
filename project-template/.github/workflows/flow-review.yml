name: flow-review

# Thin caller — the independent-AI-review logic lives in canonical (CandidDan/flow) as a
# reusable workflow, adopted here by reference. This caller owns the pull_request trigger;
# `secrets: inherit` passes CLAUDE_CODE_OAUTH_TOKEN through. See docs/flow-reusable-workflows.md
# in the flow repo.
#
# DISABLED BY DEFAULT — the reusable job is gated on repo variable FLOW_AI=true and needs the
# CLAUDE_CODE_OAUTH_TOKEN secret.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

jobs:
  flow-review:
    # id-token: write must be granted on the caller — OIDC is never in the default GITHUB_TOKEN,
    # and a reusable workflow can't raise it above the caller's grant. A permissions block is
    # exhaustive, so contents/pull-requests/issues are re-listed. See docs/flow-reusable-workflows.md.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: CandidDan/flow/.github/workflows/_flow-review.yml@v1
    secrets: inherit
