name: flow-review

# Thin caller — the independent-AI-review logic lives in canonical (CandidDan/flow) as a
# reusable workflow, adopted here by reference. This caller owns the pull_request trigger;
# `secrets: inherit` passes CLAUDE_CODE_OAUTH_TOKEN through. See docs/flow-reusable-workflows.md
# in the flow repo.
#
# DISABLED BY DEFAULT — the reusable job is gated on repo variable FLOW_AI=true and needs the
# CLAUDE_CODE_OAUTH_TOKEN secret.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

jobs:
  flow-review:
    uses: CandidDan/flow/.github/workflows/_flow-review.yml@v1
    secrets: inherit
