name: flow-sync

# Thin caller — the Flow infra adopt mechanism (propagation plan, Phase 4) lives in canonical
# (CandidDan/flow) as a reusable workflow, adopted here by reference. When this repo's
# .flow/VERSION falls behind canonical, it opens a REVIEWED PR pulling the update in — the
# complement to flow-doctor's drift *warning*. FLOW_PAT is passed by name (CAN-58) so the sync
# PR triggers flow-gates, not via `secrets: inherit`: this job has no use for
# CLAUDE_CODE_OAUTH_TOKEN and should not carry it. See docs/flow-reusable-workflows.md in the
# flow repo.
#
# Safe to run anytime: it only ever opens a reviewed PR (never auto-merges, never pushes to main),
# so it needs no FLOW_AI gate. Bump `canonical_ref` if your other callers pin a tag other than v1.

on:
  schedule:
    - cron: "27 6 * * 1"       # weekly, Monday ~06:27 UTC — off the :00 mark
  workflow_dispatch:
    inputs:
      canonical_ref:
        description: "Canonical ref to adopt from (tag/branch). Default v1."
        required: false
        type: string

concurrency:
  group: flow-sync
  cancel-in-progress: false

jobs:
  flow-sync:
    permissions:
      contents: write
      pull-requests: write
      # Required, and required HERE. A called workflow can never hold a permission its caller did
      # not grant, so `_flow-sync.yml` declaring `workflows: write` is not enough on its own —
      # this block is the ceiling. flow-sync copies canonical's thin callers into
      # `.github/workflows/`, and GitHub rejects a push touching that directory from a token
      # without `workflows`. Omit this line and every sync that adds or changes a caller fails at
      # the push with "remote rejected ... without `workflows` permission", on a schedule, with
      # nothing reaching a human.
      workflows: write
    uses: CandidDan/flow/.github/workflows/_flow-sync.yml@v1
    with:
      canonical_ref: ${{ inputs.canonical_ref }}
    secrets:
      FLOW_PAT: ${{ secrets.FLOW_PAT }}
