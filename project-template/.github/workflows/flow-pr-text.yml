name: flow-pr-text

# Thin caller — the PR-summary check lives in canonical (CandidDan/flow) as a reusable workflow,
# adopted here by reference. See docs/flow-reusable-workflows.md in the flow repo.
#
# Fails a task PR whose first paragraph is not in plain English (no backticks, file paths, task
# ids or code names, at most 60 words, and understandable without reading the code). `edited`
# re-runs it alone when you fix the description. The judge runs only with repo variable
# FLOW_AI=true and the CLAUDE_CODE_OAUTH_TOKEN secret, the same two the review checks use.

on:
  pull_request:
    types: [opened, reopened, edited, ready_for_review, synchronize]
    branches: [main]

concurrency:
  group: flow-pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flow-pr-text:
    # id-token: write must be granted here — OIDC is never in the default GITHUB_TOKEN, and a
    # reusable workflow can't raise it above the caller's grant. A permissions block is
    # exhaustive, so contents and pull-requests are re-listed.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: CandidDan/flow/.github/workflows/_flow-pr-text.yml@v5
    with:
      runner: ${{ vars.FLOW_RUNNER || 'ubuntu-latest' }}
    # Named, not `inherit` — the reusable declares only CLAUDE_CODE_OAUTH_TOKEN.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
