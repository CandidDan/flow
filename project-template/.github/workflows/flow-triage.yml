name: flow-triage

# Thin caller — the triage-sweep logic lives in canonical (CandidDan/flow) as a reusable
# workflow, adopted here by reference. This caller owns the schedule; `secrets: inherit` passes
# CLAUDE_CODE_OAUTH_TOKEN through. See docs/flow-reusable-workflows.md in the flow repo.
#
# DISABLED BY DEFAULT — the reusable job is gated on repo variable FLOW_AI=true and needs the
# CLAUDE_CODE_OAUTH_TOKEN secret. Adjust the cron to taste.

on:
  schedule:
    - cron: "0 6 * * 1-5"   # weekday mornings, before the portfolio digest — adjust to taste
  workflow_dispatch:

jobs:
  flow-triage:
    uses: CandidDan/flow/.github/workflows/_flow-triage.yml@v1
    secrets: inherit
