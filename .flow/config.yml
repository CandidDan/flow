# .flow/config.yml — canonical's own Flow calibration.
#
# Canonical is not a normal project. Most of it is Markdown: the protocol, the ADRs, the two
# adoption runbooks. A coverage floor over prose is theatre, and a build/lint/coverage stack
# bolted onto a docs repo is the kind of ceremony that gets switched off within a month and
# then lies about being enforced.
#
# But canonical is also the repo whose actual product is `.mjs` helpers and reusable workflows,
# and those deserve a stricter gate than most application code, because a bug in them
# propagates to every adopting repo at once, silently, at whatever ref they pinned.
#
# So the commands below gate the code and the workflows properly, and do not pretend to gate
# the prose. Every one of them is measured against this repo, not inherited from a stack
# convention — see the flow-0004 PR for the numbers.

project:
  name: "flow"
  language: "javascript"
  description: "Canonical Flow — the protocol, the reusable workflows, and the .flow/bin tooling that consuming repos adopt by reference."

commands:
  install: "npm ci"
  # `build` here means "prove every workflow parses". Canonical's product IS workflows; a
  # malformed reusable breaks the whole fleet and GitHub only reports it in the *consuming*
  # repo, after the bad ref has been adopted. Nothing else catches that before it ships.
  build: "npm run build"
  # `lint` is `node --check` over every tracked .mjs — no linter dependency, and it cannot
  # disagree with the runtime because it is the runtime's own parser.
  lint: "npm run lint"
  test: "npm test"
  coverage: "npm run coverage"

# MEASURED, not chosen. `npm run coverage` reported 85.31% line coverage (1696/1988) on the
# commit that introduced this file. Margin: 1.81 points. Floor: 83.5 — low enough that an
# unrelated refactor does not fail the gate on noise, high enough that a real collapse does.
# Raise it as coverage rises; never lower it silently. Sitting exactly at the floor proves
# nothing on its own — the real correctness check is the criterion-to-test mapping.
#
# This number is duplicated as `c8.lines` in package.json, because the gate runs the coverage
# COMMAND and c8 reads its threshold from there. `.flow/bin/config.test.mjs` fails if the two
# ever disagree, so the duplication cannot drift silently.
coverage_min: 83.5

# The CLAUDE.md ceiling, in BYTES of the RESOLVED IMPORT SET — `CLAUDE.md` plus every file Claude
# Code loads from it by `@`-import, each counted once. Enforced by `.flow/bin/check-claude-md.mjs`
# in the gate. `wc -c CLAUDE.md` is NOT the measurement: a repo can halve that number and increase
# what it loads by moving prose behind an import, which is exactly what adopting Flow does.
#
# MEASURED, not chosen. `node .flow/bin/check-claude-md.mjs` reported 6935 bytes across 1 file
# (canonical's root CLAUDE.md declares no imports — it points at the protocol in prose rather than
# importing it, because canonical AUTHORS the template rather than adopting it). Ceiling: 12000,
# leaving 5065 bytes of headroom — room for roughly one more section of real orientation, and not
# room for the 24,596-byte protocol to be pasted back in, which is the specific regression this
# number catches. Raise it deliberately and say why; never raise it to go green.
claude_md_max: 12000

# The queue cap (flow-0070) — a WIP limit on what gets PLANNED, not on what gets worked.
#
# At most this many tasks may be `ready` at once; `allocate-task-id` refuses a new `ready` task
# while that many already are, before it writes, commits or pushes anything. Flow already caps
# work in progress (one claim per session, `touches` overlap) and capped planning nowhere — on
# 2026-09-23 canonical held 13 `ready` tasks, nearly all of the last ~25 Flow maintaining itself.
#
# 8 is a MAXIMUM, so the 9th is refused. The only bypass is the draft's own `urgent` label, which
# is the human's to apply (the same rule as `auto-ok`) — there is no flag and no env var, because
# a bypass a session can hand itself is not a limit. A `blocked` draft is never capped: the cap
# limits the ready queue, not the store.
#
# Canonical is over the cap today, and that is the point: nothing new enters this queue until it
# drains below 8. Removing the key switches the cap off entirely.
queue_cap: 8

# The intent rule's start date (flow-0074, ADR-0007 slice 2). A `ready` task created on or after
# this date, serving anything other than `maintenance`, should name the intent it derives from in
# `intent:` — flow-doctor WARNS when it doesn't. Forward-only by construction: tasks created
# before it are never asked for one, and nothing is backfilled (a backfill would mean a session
# inventing the human's past reasons). Set to the date flow-0074's PR was opened.
intents:
  required_from: "2026-10-06"

# Gate-coverage floor. Note an honest limitation, recorded rather than papered over: every one
# of canonical's source trees lives under a dot-directory (`.flow/bin/`, `.github/workflows/`,
# `project-template/.flow/bin/`), and flow-doctor's undeclared-tree scan skips dot-directories.
# So the automatic half of this check cannot fire here, and the declarations below carry the
# weight on their own. `npm run lint` is the backstop that makes that safe: it checks every
# tracked .mjs in the repo, so a new helper is parsed wherever someone puts it.
#
# `flightdeck/` is declared as the whole tree rather than `flightdeck/bin/` (which flow-0001
# creates) — a declared root that does not exist on disk is a flow-doctor failure, and the
# broader path covers the bin directory the moment it lands.
source_roots:
  - path: ".flow/bin/"
    check: "npm run lint"
  - path: "project-template/.flow/bin/"
    check: "npm run lint"
  - path: "flightdeck/"
    check: "npm run lint"
  - path: ".github/workflows/"
    check: "npm run build"

# The review gate's auto-fix round (flow-0082). A failed qa or code-review check dispatches ONE
# bounded auto-fix worker onto the same PR, which commits; the workflow checks the round and
# pushes, and the three reviewers run again from scratch. Merge stays human.
#
# Everything else under `review:` is DATA the reusable reads rather than names — canonical has
# never set `security_paths`, which means a security review on EVERY PR, and that is the correct
# posture for the repo whose product is other repos' CI.
review:
  # Reviewer models are not set here, mirroring the template (flow-0144): they come from
  # `DEFAULT_MODELS` in `project-template/.flow/bin/flow-review.mjs` (qa and the guide on Sonnet,
  # code-review and security on Opus). Setting one is an override the plan summary warns about.

  # Two rounds, then a human. MEASURED against the case this exists for: PRs #108 and #109 each
  # sat red on ONE precise, mechanical code-review finding that a single round would have closed.
  # Two leaves room for a second finding the first round's fix uncovers, and stops there. The
  # hard maximum is 3 and raising it is a conversation, not a config edit: the fixer and the
  # reviewer are both models, and more rounds between them converge on agreement rather than on
  # correctness. Set it to 0, or delete the key, to switch auto-fix off entirely.
  #
  # RE-ARMED by flow-0135, after flow-0134 switched it off. The fixer model and FLOW_PAT now live in
  # different JOBS (`fix` and `push`), because on a runner the boundary is the job, not the step:
  # steps share the filesystem (`.git/hooks/`) and `$GITHUB_ENV` / `$GITHUB_PATH`.
  # `.flow/bin/kickback-credential-boundary.test.mjs` fails if this is above 0 while any model job
  # references FLOW_PAT.
  auto_fix_rounds: 2

security:
  secrets_scan: true
  dependency_audit: true
  focus:
    # Canonical's real risk is not its own runtime — it barely has one. It is that a mistake in
    # a reusable workflow executes with the caller's credentials, in every repo that adopted it.
    - "workflow `permissions:` blocks in .github/workflows/_flow-*.yml — least privilege, and never a repo-wide default"
    - "secret handling in the reusables: FLOW_PAT and GITHUB_TOKEN must never be echoed, interpolated into a shell string, or passed to an untrusted action"
    - "untrusted input reaching `run:` blocks — PR titles and branch names are attacker-controlled and are interpolated by flow-status/flow-done"
    - "the `uses:` pins consuming repos inherit — an unpinned or moved third-party action is a supply-chain hole in every adopting repo at once"
    - "dependency footprint: canonical ships as source that others copy, so every dependency added here is a dependency imposed downstream"

git:
  base_branch: "main"
  branch_prefix: "flow/"
  protect_main: true
