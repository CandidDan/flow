name: _flow-open-pr (reusable)

# Reusable form of the auto-PR-on-push step (CAN-50). Repos call it from a thin caller that
# owns the `push` trigger; the logic is authored once in canonical. See
# docs/flow-reusable-workflows.md.
#
# CAN-50: take the model off the critical path for PR creation. Autonomous workers reliably do
# the whole loop — claim, branch, build, gate, push — then end their turn WITHOUT running
# `gh pr create`, stranding the task `in_progress` with a pushed branch and no PR (observed
# twice on CAN-43). PR creation is a deterministic, mechanical step, so it should not depend on
# the model's diligence: this workflow opens the PR on branch push. A worker stopping short then
# becomes harmless — the PR opens regardless, flow-status records `branch` + `pr` on the task, and
# the work is visible on a PR instead of stranded on an orphan branch. (It opens as a DRAFT, so the
# task stays `in_progress` until the worker marks it ready — see OPENS A DRAFT below. This
# paragraph said "flow-status flips the task to in_review" until flow-0039 moved that transition
# onto `ready_for_review`.) Because the workflow opens it, the `[<id>] <title>` title is correct
# every time.
#
# Idempotent: a re-push never opens a second PR (the helper AND the create step both gate on
# "no open PR for this branch" — `gh pr list --state open` counts drafts, so the draft this now
# opens still satisfies that guard). Only worker branches (flow/<id>-…) ahead of base get a PR.
#
# OPENS A DRAFT (flow-0039). CAN-50 fires on the FIRST push, not on completion, so the PR this
# opens is routinely a branch one commit in. Opening it ready for review made three things treat
# unfinished work as finished: `_flow-status.yml` flipped the task to `in_review` (so the store and
# the flightdeck reported a task awaiting a human while the worker was still building),
# `_flow-review.yml` ran the three Definition-of-Done reviewers on `opened` AND on every subsequent
# `synchronize` — three agent invocations per work-in-progress push — and a red gate on half-written
# code read as a failing PR rather than a build in progress.
#
# The fix is deliberately NOT to gate PR creation on a readiness signal: that reintroduces exactly
# the failure CAN-50 exists to prevent, because a worker that forgets `gh pr create` is the same
# worker that forgets to signal ready. The PR still opens unconditionally on the first push; it
# just opens as a draft, and `flow-status`/`flow-review` key off `ready_for_review` instead of off
# the PR existing. The worker's hand-off step is now `gh pr ready`.
#
# `flow-gates` deliberately still runs on drafts — a worker wants the gate red early.
#
# GATING AUTO-WORKER PRs (CAN-58). A PR opened with the Actions GITHUB_TOKEN does NOT trigger
# downstream workflows (GitHub's loop-prevention), so `flow-gates` (on: pull_request) never ran
# on the PRs this workflow creates — the Definition-of-Done gate was silently bypassed for the
# entire autonomous path (observed on CAN-47 #122: only open-pr + Vercel ran until a human
# close/reopened it). Fix: open the PR with a Personal Access Token (`FLOW_PAT`) instead, so the
# `pull_request` event is attributed to a real actor and `flow-gates` fires automatically.
#
#   Required secret:  FLOW_PAT (passed by the thin caller by name, not `secrets: inherit`)
#   How to create it: GitHub → Settings → Developer settings → Fine-grained PATs → Generate.
#     Repository access: this repo only. Permissions: Contents = Read, Pull requests = Read/Write.
#     Save it as a repo secret named FLOW_PAT (Settings → Secrets and variables → Actions).
#   Until the secret exists the expression below falls back to GITHUB_TOKEN — behaviour is
#   exactly as before (PR opens, but ungated), so adding the secret is a no-break enablement.

on:
  workflow_call:
    secrets:
      FLOW_PAT:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need base + branch history for rev-list

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide whether to open a PR
        id: decide
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bootstrap guard: the helper lives in the consuming repo once it adopts the template.
          if [ ! -f .flow/bin/flow-open-pr.mjs ]; then
            echo "No .flow/bin/flow-open-pr.mjs in this repo yet — nothing to do."
            echo "open=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch -q origin main
          ahead="$(git rev-list --count origin/main..HEAD)"
          has_open_pr="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')"
          echo "has_open_pr=$has_open_pr" >> "$GITHUB_OUTPUT"

          # Pure decision: opens only when the branch carries a task id, is ahead of base, and
          # has no open PR. Emits {id,title,head,base} JSON, or nothing.
          decision="$(node .flow/bin/flow-open-pr.mjs --branch "$BRANCH" --base main --ahead "$ahead" --has-open-pr "$has_open_pr")"
          if [ -z "$decision" ]; then
            echo "No PR to open for '$BRANCH' (already open, not ahead of base, or no parseable id)."
            echo "open=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "open=1" >> "$GITHUB_OUTPUT"
          id="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).id)' "$decision")"
          title="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).title)' "$decision")"
          # id is regex-constrained (no metachars); use the multiline-safe heredoc form for the
          # title so an unexpected newline could never inject a second GITHUB_OUTPUT key.
          echo "id=$id" >> "$GITHUB_OUTPUT"
          { echo "title<<FLOW_EOF"; echo "$title"; echo "FLOW_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Open the PR
        # Belt-and-braces idempotency: the create step itself gates on "no existing open PR",
        # on top of the helper's decision. A re-push can never open a duplicate.
        if: steps.decide.outputs.open == '1' && steps.decide.outputs.has_open_pr == '0'
        env:
          BRANCH: ${{ github.ref_name }}
          TASK_ID: ${{ steps.decide.outputs.id }}
          TITLE: ${{ steps.decide.outputs.title }}
          # FLOW_PAT (a real actor) makes the PR-opened event trigger flow-gates; falls back to
          # GITHUB_TOKEN (ungated, the pre-CAN-58 behaviour) when the secret isn't set. See header.
          GH_TOKEN: ${{ secrets.FLOW_PAT || github.token }}
        run: |
          # Link the task file; do NOT invent acceptance text — the criteria checklist and DoD
          # live in the task file and are completed by the worker / enforced by the gate.
          task_path="$(grep -rl "^id: \"${TASK_ID}\"" .flow/tasks/ | head -1)"
          body="$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "Auto-opened as a **draft** by **flow-open-pr** (CAN-50) on branch push — the worker pushed \`${BRANCH}\` but a PR did not yet exist." \
            "Task: \`${task_path:-.flow/tasks/ (id ${TASK_ID})}\`" \
            "Acceptance criteria, the proving tests, and the Definition-of-Done checklist live in the task file and are completed by the worker before this PR is ready for review." \
            "**It stays a draft until the worker runs \`gh pr ready\`.** While it is a draft the task stays \`in_progress\` and the three Definition-of-Done review checks do not run; marking it ready is what flips the task to \`in_review\` and asks for review.")"
          # --draft is flow-0039: the PR opens on the FIRST push, so announcing it ready for review
          # made flow-status flip the task to in_review and flow-review spend three agent runs on
          # unfinished work — again on every subsequent push. Opening it draft keeps CAN-50's
          # guarantee (the PR always exists) without the claim that the work is done.
          #
          # Draft PRs need a paid plan on a private repo. Where they are unavailable, fall back to a
          # non-draft PR: a branch with no PR at all is the failure CAN-50 exists to prevent, and it
          # is strictly worse than one that opens ready. The fallback warns rather than passing quietly.
          if ! gh pr create --draft --base main --head "$BRANCH" --title "$TITLE" --body "$body"; then
            echo "::warning::Could not open a draft PR (draft pull requests need a paid plan on a private repo). Retrying without --draft — the PR will open ready for review."
            # DELIBERATELY no `|| echo …` here, unlike _flow-recover.yml's otherwise-identical
            # fallback. Do not "harmonise" the two: recover sweeps many stranded tasks in one run,
            # so one bad create must not abort the rest; this step handles exactly one push, and a
            # swallowed failure here is a branch with no PR reported as green — the silent CAN-50
            # failure this whole workflow exists to prevent. It must fail loudly.
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$body"
          fi
