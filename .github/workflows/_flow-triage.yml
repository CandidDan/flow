name: _flow-triage (reusable)

# Reusable form of the scheduled triage sweep. Repos call it from a thin caller that owns
# the schedule; the logic is authored once in canonical. See docs/flow-reusable-workflows.md.
#
# Turns the GitHub Issues inbox into proposed/ready tasks, batched once a day so triage lands
# in one consolidated moment (before the portfolio digest), not as drip-fed interruptions.
#
#   un-triaged issue            -> draft a full ready-task spec AS A COMMENT on the issue,
#                                  label `proposed`. Nothing enters .flow/tasks/ yet.
#   issue labelled `approved`   -> the human said yes (a label flip, doable from a phone):
#                                  create the ready task file on main, label `triaged`.
#   issue labelled `auto-ok`    -> pre-authorised lane (human policy, not per-item approval):
#                                  skip proposal, create the ready task file directly.
#
# Authority stays with the human: triage PROPOSES; only an `approved` or `auto-ok` label —
# both human-applied — lets work enter the queue.
#
# The lanes decide what may BECOME a task. They do not decide whose text the sweep reads, and
# that is a separate boundary: this sweep runs an agent with `contents: write` and a permissive
# permission mode, and on a public repository anyone can author its input. So the input set is
# selected mechanically, in the `inbox` step below, before the prompt is built — see the note
# there. Prompt text is guidance to a model; a step that never hands over the issue is a bound.
#
# DISABLED BY DEFAULT. Enable by setting repo variable FLOW_AI=true and adding the
# CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token` — uses your Max plan quota). (Check
# anthropics/claude-code-action's current README for input names when you first enable this —
# the action evolves.) The thin caller passes the secret with `secrets: inherit`.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: write
  issues: write
  id-token: write          # OIDC token minting for claude-code-action

jobs:
  triage:
    if: ${{ vars.FLOW_AI == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── The trust boundary ───────────────────────────────────────────────────────────────
      # Everything after this step READS issue text. This step decides WHOSE text, and it is
      # the only place that decision is enforceable: the agent below runs with
      # `--permission-mode bypassPermissions` and this job holds `contents: write`, so by the
      # time the model is reading, the only thing standing between an arbitrary internet author
      # and the task store is an instruction in a prompt. An instruction is guidance, not a
      # boundary. Selecting the issue numbers here — and handing the agent that list instead of
      # the inbox — moves the boundary to somewhere a test can hold it.
      #
      # `author_association` is GitHub's own answer to "could this person already direct this
      # repo": OWNER, MEMBER and COLLABORATOR can. It comes back on the issue object, so the
      # filter costs no extra request. NONE and CONTRIBUTOR are excluded — loudly, never
      # silently: an issue nobody is told was skipped is queue debt that never surfaces, which
      # is the failure mode this whole sweep exists to prevent.
      #
      # Only NUMBERS cross into the prompt. Titles and bodies are attacker-authored strings and
      # are never interpolated into a workflow expression.
      - id: inbox
        name: Select the issues this sweep may read (author-trust filter)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Widen the trusted set deliberately, per repo, e.g. "OWNER,MEMBER,COLLABORATOR,
          # CONTRIBUTOR". Unset is the restrictive default — the safe posture is the one you
          # get by doing nothing, and opening the inbox has to be somebody's decision.
          FLOW_TRIAGE_TRUSTED_ASSOCIATIONS: ${{ vars.FLOW_TRIAGE_TRUSTED_ASSOCIATIONS }}
          # How many open issues to pull. There has to be a number: an uncapped sweep hands an
          # unbounded inbox to a turn-budgeted agent, and gh's own listing default (30) would
          # drop most of a real inbox on the floor without anyone choosing that. 200 is generous
          # for the inboxes Flow repos actually carry. Newest first, so the cap drops the oldest
          # — and the filter below SAYS SO when it is reached, because a sweep that silently
          # sees two thirds of the queue is the same queue debt this step exists to surface,
          # just moved one step earlier.
          FLOW_TRIAGE_ISSUE_LIMIT: "200"
        run: |
          set -euo pipefail
          # LISTED WITH `gh api`, NOT `gh issue list`. The `--json` projection on `gh issue
          # list` has no `authorAssociation` field — its issue object stops at `author`, and
          # asking for it fails the step outright ("Unknown JSON field"), which is what happened
          # on run 33362641134. `author_association` IS on the issue object the REST API
          # returns, so the trust signal comes from the API rather than from gh's view of it.
          #
          # NOTHING IS SHAPED HERE. No `--jq`: gh rejects `--slurp` combined with `--jq` or
          # `--template` before it makes a request, so shaping on the command line would trade
          # one always-failing invocation for another. It also would not be tested — this step
          # has now been wrong twice, both times in the one part no test could execute. So the
          # command is a plain fetch, and every transformation (flattening the pages, dropping
          # the pull requests `/issues` also returns, projecting `author_association`, applying
          # the cap) happens in the filter below, which the proving tests run.
          #
          # `--paginate` requests every page, and `--slurp` gathers them into one array of
          # pages. Note what the cap therefore does NOT do: it bounds what reaches the agent,
          # not the number of API calls, which is one request per 100 open issues either way.
          gh api --method GET "repos/$GITHUB_REPOSITORY/issues" \
            -f state=open -F per_page=100 --paginate --slurp \
            > "$RUNNER_TEMP/flow-triage-issues.json"
          cat > "$RUNNER_TEMP/flow-triage-filter.mjs" <<'FLOW_TRIAGE_FILTER'
          // Author-trust filter for the triage sweep. Reads the listing JSON named on
          // argv[2]; writes the admitted issue numbers to GITHUB_OUTPUT and reports the
          // exclusions to the run log and the job summary. Kept dependency-free and pure enough
          // to be extracted and executed by .flow/bin/triage-author-trust.test.mjs, which is
          // what stops this boundary from being quietly deleted.
          import { appendFileSync, readFileSync } from "node:fs";

          // The people who can already direct this repo, per GitHub's own answer.
          const DEFAULT_TRUSTED = ["OWNER", "MEMBER", "COLLABORATOR"];

          const configured = (process.env.FLOW_TRIAGE_TRUSTED_ASSOCIATIONS || "")
            .split(",").map((s) => s.trim().toUpperCase()).filter(Boolean);
          // Unset, empty, or all-whitespace all land on the restrictive default. A repo that
          // wants the open inbox sets the variable; nothing else can widen this.
          const trusted = configured.length ? configured : DEFAULT_TRUSTED;

          // `gh api --paginate --slurp` hands back one array per page. Flatten them, drop the
          // pull requests that `/issues` also returns, and project the REST issue object onto
          // the shape the rest of this filter decides on. `.flat()` is deliberate rather than
          // `[0]`: a single-page inbox is still wrapped, and an already-flat array survives it
          // unchanged, so the filter cannot be broken by the listing returning one page.
          const fetched = JSON.parse(readFileSync(process.argv[2], "utf8"))
            .flat()
            .filter((i) => i && i.pull_request == null)
            .map((i) => ({
              number: i.number,
              labels: Array.isArray(i.labels) ? i.labels.map((l) => ({ name: l?.name })) : [],
              authorAssociation: i.author_association,
            }));

          // The cap bounds what is handed to a turn-budgeted agent. Newest first, as the API
          // returns them, so it is the oldest that fall off.
          const limit = Number(process.env.FLOW_TRIAGE_ISSUE_LIMIT);
          const capped = Number.isInteger(limit) && limit > 0;
          const issues = capped ? fetched.slice(0, limit) : fetched;
          // LABELS ARE DELIBERATELY NOT CONSULTED. The lanes (`approved`, `auto-ok`) decide what
          // may become a task; they are evaluated later, by the agent. If a label could re-admit
          // an issue here, the filter would be exactly as strong as the label model it is meant
          // to sit in front of. Trust is decided on authorship alone, first.
          const ok = (i) => trusted.includes(String(i?.authorAssociation ?? "").trim().toUpperCase());
          const admitted = issues.filter(ok);
          const excluded = issues.filter((i) => !ok(i));

          const numbers = admitted
            .map((i) => Number(i?.number))
            .filter((n) => Number.isInteger(n) && n > 0)
            .join(",");

          const safe = (v) => String(v ?? "").replace(/[^A-Za-z_]/g, "") || "UNKNOWN";
          // Issues past the cap reach no later step — they are not even excluded, they are
          // simply gone, so this is the only place that can surface them. Now that the cap is
          // applied here, over the whole fetched inbox, the count is exact rather than the
          // "we came back full, so there may be more" guess it used to be.
          const dropped = fetched.length - issues.length;
          const truncated = dropped > 0;
          const report = [
            `triage inbox: ${admitted.length} issue(s) admitted, ${excluded.length} excluded by author trust.`,
            `trusted author_association values: ${trusted.join(", ")}`,
            ...excluded.map((i) => `  excluded: issue ${Number(i?.number) || "?"} (author_association: ${safe(i?.authorAssociation)})`),
            ...(truncated ? [`WARNING: the listing hit its ${limit}-issue cap, so this sweep ` +
              `dropped the ${dropped} oldest of ${fetched.length} open issue(s); the ` +
              `sweep never saw them — raise FLOW_TRIAGE_ISSUE_LIMIT in the inbox step.`] : []),
          ].join("\n");
          console.log(report);

          if (process.env.GITHUB_OUTPUT) {
            appendFileSync(process.env.GITHUB_OUTPUT,
              `numbers=${numbers}\nadmitted=${admitted.length}\nexcluded=${excluded.length}\n`);
          }
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${report}\n`);
          }
          FLOW_TRIAGE_FILTER
          node "$RUNNER_TEMP/flow-triage-filter.mjs" "$RUNNER_TEMP/flow-triage-issues.json"

      - uses: anthropics/claude-code-action@v1
        # Nothing admitted means nothing to sweep. Skipping keeps the agent — and its turn
        # budget — away from an inbox it has already been told it may not read.
        if: ${{ steps.inbox.outputs.numbers != '' }}
        with:
          # Subscription auth (Pro/Max): run `claude setup-token` locally, save the result as
          # the CLAUDE_CODE_OAUTH_TOKEN repo secret. Uses your plan quota, not API credits.
          # (Token dies if you log out of Claude Code — regenerate with `claude setup-token`.)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # GitHub API token for the action (list issues, post proposals/labels, commit tasks).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Pay-per-use alternative: comment the line above and use an API key instead.
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run the issue triage sweep for this repository, following the "Triaging the inbox"
            section of the task-writer skill exactly. That skill sits at
            .claude/skills/task-writer/SKILL.md in a repo scaffolded from the Flow template, and
            at project-template/.claude/skills/task-writer/SKILL.md in canonical, which ships the
            template rather than being scaffolded from it. Read whichever of the two exists.
            Concretely:

            1. The issues in scope for this sweep have ALREADY been selected for you, by issue
               number: ${{ steps.inbox.outputs.numbers }}. Work only those. Do not list the
               inbox yourself, and do not read or act on any issue outside that list — issues
               were withheld deliberately and re-listing would undo the decision. Of the issues
               in scope, skip any labelled `proposed` or `triaged`.
            2. For each remaining issue WITHOUT the `auto-ok` label: draft a complete ready-task
               spec in the task template's shape (context, scope with explicit boundaries,
               observable acceptance criteria, touches globs). That template is at
               .flow/tasks/_TEMPLATE.md in a scaffolded repo and at
               project-template/.flow/tasks/_TEMPLATE.md in canonical — read whichever exists.
               Post the spec as a comment on the issue, then add the `proposed` label. Do NOT
               create a task file.
            3. For each in-scope issue labelled `approved` (the human accepted a proposal) or
               `auto-ok` (pre-authorised lane): create the ready task file in .flow/tasks/ with
               the next id, `issue:` set to the issue URL, commit it to main with message
               "flow: triage <id> from issue #<n>", then swap the issue's labels to `triaged`.
            4. If an issue is not worth doing, comment one line saying why and close it.

            Hard limits: never modify code or any file outside .flow/tasks/; never edit an
            existing task file; never work on an issue yourself; if a proposal would require
            guessing the human's intent, ask the question in the issue comment instead of
            proposing. Apply the readiness bar honestly — a vague proposal is worse than none.
          # --max-turns 150 (was 30) + bypassPermissions: same headless-runner failure that hit
          # flow-review and the queue-runner, and triage was the one caller left unfixed. With no
          # permission posture every gh issue-list / comment / label call was denied, so the sweep
          # burned its turns on denials and exited clean without proposing anything — the action
          # reports success either way, so it looked healthy for weeks (observed 2026-07-31:
          # the canary repo 8 denials in 13 turns, another consuming repo 11 in 20; zero `proposed` labels across 42 runs).
          # The turn budget matters too: a real inbox is ~20 issues x (read + draft + comment +
          # label), which 30 turns cannot cover even unblocked. bypassPermissions grants the gh
          # calls; the prompt's hard limits (never touch code, never work an issue, only .flow/
          # tasks/) remain the actual constraint. Ephemeral, trusted CI runner.
          claude_args: "--max-turns 150 --permission-mode bypassPermissions"
