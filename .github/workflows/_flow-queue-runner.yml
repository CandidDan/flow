name: _flow-queue-runner (reusable)

# Reusable form of the queue runner. Repos call it from a thin caller that owns the schedule
# and the workflow_dispatch input (forwarded here via `with: task_id`); the logic is authored
# once in canonical. See docs/flow-reusable-workflows.md.
#
# Drains the ready queue without you re-running a command per task. Two ways in:
#   - schedule (in the caller): on a cadence, pick the top ready task (pick-task.mjs) and
#     dispatch a fresh worker to it. Keep the `ready` queue stocked and the backlog drains.
#   - workflow_dispatch with a task_id (in the caller, forwarded here): work exactly that task
#     now. This is also the hook the board's "Work this →" link uses.
#
# Each run is a FRESH worker session (a new claude-code-action invocation) — never one long
# thread across tasks, matching the protocol's "fresh session per task" rule. The worker runs
# the full loop (claim → branch → build → gate → PR) and STOPS at the PR; merge stays human.
#
# DISABLED BY DEFAULT. Enable: repo variable FLOW_AI=true + CLAUDE_CODE_OAUTH_TOKEN secret
# (`claude setup-token` — uses your Max plan quota, not API credits). The thin caller passes
# the secret with `secrets: inherit`.

on:
  workflow_call:
    inputs:
      task_id:
        description: "Task id to work (e.g. CAN-32). Leave blank to auto-pick the top ready task."
        required: false
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: write
  pull-requests: write
  id-token: write          # OIDC token minting for claude-code-action

jobs:
  dispatch:
    if: ${{ vars.FLOW_AI == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Choose the task to work
        id: pick
        env:
          INPUT_ID: ${{ inputs.task_id }}
        run: |
          id="$INPUT_ID"
          if [ -z "$id" ]; then id="$(node .flow/bin/pick-task.mjs)"; fi
          if [ -z "$id" ]; then
            echo "Queue dry — no ready task with a clear blast radius. Nothing to dispatch."
            echo "task_id=" >> "$GITHUB_OUTPUT"
          else
            echo "Dispatching a worker for $id."
            echo "task_id=$id" >> "$GITHUB_OUTPUT"
          fi

      - name: Work the task (fresh worker session)
        if: ${{ steps.pick.outputs.task_id != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth (Pro/Max) — uses your plan quota, not API credits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # GitHub API token for the action's git/PR operations. NB: a PR the worker opens with
          # GITHUB_TOKEN does NOT trigger flow-gates (CAN-58) — _flow-open-pr/_flow-recover catch
          # and re-open it under FLOW_PAT so the gate still fires.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}   # pay-per-use alternative
          # The build role gets the strongest model — fewer blocks/kickbacks = fewer human
          # touchpoints, which is the whole point of the loop. Alias (not a pinned version) so it
          # tracks the latest Opus. Note: heavier on Max-plan quota than Sonnet. The independent
          # reviewer (flow-review) is deliberately left on a different model for genuine diversity.
          #
          # model + permissions go through claude_args, NOT as top-level inputs. This action version
          # has no `model` input — passing one emitted "Unexpected input(s) 'model'" and silently fell
          # back to the default Sonnet (so `model: opus` never took effect). And a headless worker has
          # nobody to approve tool prompts: without an explicit permission posture, every Bash call
          # (the git claim-push, the branch, `gh pr create`, npm/gate commands) is DENIED — the worker
          # burns its turns, claims nothing, and ends "successfully" having pushed no branch and opened
          # no PR (observed on Nudge: 17 permission denials per run, all ready tasks left untouched).
          # `--permission-mode bypassPermissions` makes the loop autonomous on an ephemeral, trusted CI
          # runner; scope stays fenced by the task's `touches` + the touches-guard CI gate, not by
          # per-tool prompts.
          claude_args: "--max-turns 60 --model opus --permission-mode bypassPermissions"
          prompt: |
            You are the Flow worker for a single task. Read CLAUDE.md (the protocol) and the task
            file in .flow/tasks/ whose id is "${{ steps.pick.outputs.task_id }}". Run the full loop:

            1. CLAIM: git pull --rebase; set the task to in_progress with owner + started; commit
               that task file to main and push. If the push is rejected, another worker claimed
               it — stop, do nothing further.
            2. BRANCH off latest main: flow/${{ steps.pick.outputs.task_id }}-<slug>.
            3. BUILD strictly against the task's acceptance criteria and within its declared
               `touches` — nothing more, nothing outside those globs.
            4. GATE: run the project's build/lint/test/coverage from .flow/config.yml plus the
               qa-verifier, security-reviewer and code-reviewer subagents. Fix failures; do not
               open the PR until all pass.
            5. PR: open it titled "[${{ steps.pick.outputs.task_id }}] <title>", link the task
               file, paste the acceptance checklist with the proving test for each item. STOP —
               do not merge.

            If a real decision is needed that the task didn't settle, set the task `blocked` with
            a `blocked_reason` and stop rather than guessing. Never widen scope past `touches`.
