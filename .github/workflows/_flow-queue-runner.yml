name: _flow-queue-runner (reusable)

# Reusable form of the queue runner. Repos call it from a thin caller that owns the schedule
# and the workflow_dispatch input (forwarded here via `with: task_id`); the logic is authored
# once in canonical. See docs/flow-reusable-workflows.md.
#
# Drains the ready queue without you re-running a command per task. Two ways in:
#   - schedule (in the caller): on a cadence, pick the top ready task (pick-task.mjs) and
#     dispatch a fresh worker to it. Keep the `ready` queue stocked and the backlog drains.
#   - workflow_dispatch with a task_id (in the caller, forwarded here): work exactly that task
#     now. This is also the hook the board's "Work this →" link uses.
#
# Each run is a FRESH worker session (a new claude-code-action invocation) — never one long
# thread across tasks, matching the protocol's "fresh session per task" rule. The worker runs
# the full loop (claim → branch → build → gate → PR) and STOPS at the PR; merge stays human.
#
# DISABLED BY DEFAULT. Enable: repo variable FLOW_AI=true + CLAUDE_CODE_OAUTH_TOKEN secret
# (`claude setup-token` — uses your Max plan quota, not API credits). The thin caller passes
# both secrets this reusable declares by name, not `secrets: inherit`.
#
# TIMING LIVES IN REPO VARIABLES, NEVER IN THE CALLER (flow-0080). `on:` is parsed statically and
# cannot read `vars.*`, so anything expressed in the caller — a cron hour, GitHub's native
# `timezone:` — is a literal in a file `flow-sync` overwrites, in every repo, edited by hand on
# every move. The caller therefore ticks hourly and the `schedule-gate` job below decides, from
# three variables set once per repo with `gh variable set` (no file edit, survives a sync):
#
#   FLOW_QUEUE_RUNNER=paused   scheduled ticks dispatch nothing; `workflow_dispatch` still works.
#                              This is the pause that LEAVES REVIEW RUNNING — FLOW_AI=false also
#                              switches off the three PR review checks, triage and compass, which
#                              is how migrated repos ended up briefly with no review at all.
#   FLOW_TZ                    an IANA zone, e.g. Australia/Sydney.
#   FLOW_RUN_HOUR              0-23, the LOCAL hour the day's run should start.
#
# Both of the last two, or neither. Unset, the gate reproduces the old `0 7 * * 1-5` UTC cron
# exactly. The decision is `.flow/bin/queue-runner-schedule.mjs` — a pure function with unit
# tests, because "runs at 07:00 local, once, even when the scheduler is two hours late" is
# otherwise only observable by watching a cron for a week.

on:
  workflow_call:
    inputs:
      task_id:
        description: "Task id to work (e.g. CAN-32). Leave blank to auto-pick the top ready task."
        required: false
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      FLOW_PAT:
        required: false

permissions:
  contents: write
  pull-requests: write
  id-token: write          # OIDC token minting for claude-code-action

jobs:
  # Is THIS tick the day's run? Scheduled ticks only: a `workflow_dispatch` skips this job
  # entirely, which is what makes FLOW_QUEUE_RUNNER=paused a pause of the SCHEDULE rather than of
  # the runner — working a single task on purpose stays available while the queue is paused.
  #
  # The job is deliberately small. The caller now ticks hourly, so most runs reach this job, say
  # why they are not the run, and stop: no full checkout, no fetch-depth 0, no npm, no agent.
  schedule-gate:
    if: ${{ vars.FLOW_AI == 'true' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    # Job-scoped, and NOT added to this file's top-level `permissions:` — `actions: read` is
    # needed by this job alone, and a reusable's permissions are capped by its caller's grant, so
    # a top-level entry would demand the scope from every caller including the ones whose
    # dispatch-only callers never reach this job. The template caller grants it; see its header.
    permissions:
      contents: read          # the sparse checkout below
      actions: read           # `gh run list` + the jobs API: did a run already dispatch today?
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      # Sparse and shallow: deciding needs the helper, not a worktree. `sparse-checkout` with
      # cone mode off takes the one directory, and no credential is persisted because this job
      # pushes nothing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .flow/bin
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # "Has today's run already gone out?" is the only input the decision cannot derive from the
      # clock, and it is what stops an hourly cron dispatching an hourly worker. It is read from
      # the Actions API rather than from any state this repo writes: a run that dispatched a
      # worker is a fact about the runs themselves, so there is nothing to keep in sync.
      #
      # EVIDENCE, NOT CONCLUSION — a run counts as "dispatched" only if its dispatch job actually
      # reached the worker step. A tick that ran, found the queue dry and skipped that step did
      # not consume the day: work arriving at 09:00 must still be picked up at 10:00.
      - name: Gather this workflow's earlier scheduled runs
        if: ${{ vars.FLOW_QUEUE_RUNNER != 'paused' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          # BOOTSTRAP: the reusable can move ahead of the caller's sync. Until the repo has synced
          # queue-runner-schedule.mjs, its caller's permissions block predates flow-0080 and grants
          # no `actions` scope, so listing runs would 403 and fail this job before the Decide step's
          # own bootstrap branch could proceed as before. Skip the API entirely in that window.
          if [ ! -f .flow/bin/queue-runner-schedule.mjs ]; then
            printf '[]\n' > "$RUNNER_TEMP/earlier-runs.json"
            echo "queue-runner-schedule.mjs not synced yet — no earlier-runs lookup (bootstrap)."
            exit 0
          fi
          # `github.workflow_ref` is `<owner>/<repo>/.github/workflows/<caller>.yml@<ref>`, and
          # the CALLER's filename is what `gh run list --workflow` matches — inside a reusable
          # there is no other way to name the workflow whose runs these are. Strip the `@<ref>`
          # FIRST: the ref is `refs/heads/<branch>` and holds slashes, so stripping the path first
          # leaves the branch name (flow-0132 — every scheduled tick on 3.0.0 failed this way).
          file="${WORKFLOW_REF%@*}"; file="${file##*/}"
          # 36 hours covers the current local day in every zone (UTC-12 .. UTC+14) with room to
          # spare, so the window can never cut off a run the decision would have counted.
          cutoff="$(date -u -d '36 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh run list --workflow "$file" --event schedule --limit 60 \
            --json databaseId,createdAt > "$RUNNER_TEMP/runs.json"

          entries=""
          # Newest first, which is the order `gh run list` returns: the loop stops at the first
          # run that dispatched, because every run after it in time dispatched nothing. That caps
          # the per-tick API cost at (ticks since the last dispatch) + 1 instead of one call per
          # run in the window.
          while read -r id created; do
            [ -n "$id" ] || continue
            worked="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '
              [ .jobs[]
                | select(.name | endswith("dispatch"))
                | .steps[]?
                | select(.name | startswith("Work the task"))
                | select(.conclusion != "skipped")
              ] | length' || echo "")"
            if [ -z "$worked" ]; then
              # Fail closed: an unreadable run is counted as a dispatch. Guessing "no" here is
              # the one guess that dispatches a second worker at the same task.
              echo "::warning::could not read jobs for run $id — counting it as a dispatch"
              worked=1
            fi
            if [ "$worked" -gt 0 ]; then
              entries="${entries}{\"at\":\"$created\",\"dispatched\":true},"
              break
            fi
            entries="${entries}{\"at\":\"$created\",\"dispatched\":false},"
          done <<EOF
          $(jq -r --arg cutoff "$cutoff" --arg cur "$GITHUB_RUN_ID" '
              .[]
              | select(.createdAt > $cutoff)
              | select((.databaseId|tostring) != $cur)
              | "\(.databaseId) \(.createdAt)"' "$RUNNER_TEMP/runs.json")
          EOF
          printf '[%s]\n' "${entries%,}" > "$RUNNER_TEMP/earlier-runs.json"
          cat "$RUNNER_TEMP/earlier-runs.json"

      # One line to the step summary on EVERY tick, whichever way it goes. An hourly workflow is
      # mostly skips, and a skip that prints nothing is indistinguishable from a runner that has
      # quietly died — so each run says, by name, which answer it gave.
      - name: Decide whether this tick is the run
        id: decide
        env:
          FLOW_QUEUE_RUNNER: ${{ vars.FLOW_QUEUE_RUNNER }}
          FLOW_TZ: ${{ vars.FLOW_TZ }}
          FLOW_RUN_HOUR: ${{ vars.FLOW_RUN_HOUR }}
        run: |
          # Bootstrap guard: the helper lives in the consuming repo once it adopts the template,
          # and a repo can pin this reusable before `flow-sync` delivers it. Until then the tick
          # proceeds exactly as it did before flow-0080 — its caller still carries the daily cron,
          # so "proceed" is one run per day — and the pause is enforced here instead, because a
          # pause that waits for a sync is not a pause. The schedule variables cannot take effect
          # until the helper lands, and the summary says so rather than looking like they did.
          if [ ! -f .flow/bin/queue-runner-schedule.mjs ]; then
            if [ "$FLOW_QUEUE_RUNNER" = "paused" ]; then
              proceed=false; label="no dispatch"
              reason="skipped: FLOW_QUEUE_RUNNER is \"paused\". This repo has not synced .flow/bin/queue-runner-schedule.mjs yet, so the pause is enforced in the workflow; review, triage and compass are untouched. Resume with \`gh variable delete FLOW_QUEUE_RUNNER\`."
            else
              proceed=true; label="dispatching"
              reason="run: no .flow/bin/queue-runner-schedule.mjs in this repo yet, so this tick proceeds on its caller's cron exactly as before flow-0080. FLOW_TZ and FLOW_RUN_HOUR cannot take effect until flow-sync delivers the helper and the hourly caller."
            fi
            { echo "proceed=$proceed"; echo "code=bootstrap"; echo "reason=$reason"; } >> "$GITHUB_OUTPUT"
            echo "- **$label** (\`bootstrap\`) — $reason" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Writes proceed/code/reason to $GITHUB_OUTPUT and the one-line summary itself, so no
          # decision text is interpolated into a shell string anywhere in this file.
          node .flow/bin/queue-runner-schedule.mjs \
            --event "$GITHUB_EVENT_NAME" \
            --queue-runner "$FLOW_QUEUE_RUNNER" \
            --tz "$FLOW_TZ" \
            --run-hour "$FLOW_RUN_HOUR" \
            --runs-file "$RUNNER_TEMP/earlier-runs.json"

  dispatch:
    needs: schedule-gate
    # FLOW_AI stays the master switch, first in the expression and unchanged: false still turns
    # the whole fleet off. Past it, the two ways in are spelled out separately rather than
    # collapsed, because they are genuinely different runs:
    #
    #   · workflow_dispatch — the gate job is SKIPPED (its own `if` excludes the event), and a
    #     skipped dependency normally skips this job too. `!cancelled()` is what drops that
    #     implicit success requirement; `result == 'skipped'` is what keeps the condition honest
    #     about which path it is on, and a FAILED gate therefore dispatches nothing.
    #   · schedule — the gate ran and said so in `proceed`.
    #
    # Folded onto one line by YAML (`>-` with no extra indent): a `${{ }}` expression may span
    # lines, but only folding guarantees the parser sees one.
    if: >-
      ${{ !cancelled() && vars.FLOW_AI == 'true'
      && ( (github.event_name != 'schedule' && needs.schedule-gate.result == 'skipped')
      || (needs.schedule-gate.result == 'success' && needs.schedule-gate.outputs.proceed == 'true') ) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          # The credential this persists in `.git/config` is what the WORKER's `git push` uses
          # later, and it is the only thing that decides whether that push is accepted. Left at
          # the default it is GITHUB_TOKEN, and GitHub refuses any GITHUB_TOKEN push that adds or
          # changes a file under `.github/workflows/` — server-side, however `permissions:` above
          # is written, because `workflows` is not one of GITHUB_TOKEN's grantable permissions.
          # The `github_token:` input below does NOT help: it reaches the action's own API calls,
          # not git's persisted credential. So a worker on a task whose `touches` includes a
          # workflow file cannot push at all (observed in an adopting repo, flow-0093), and
          # canonical's own queue has several such tasks. FLOW_PAT is a fine-grained PAT and CAN
          # carry Workflows: Read and write, so pushing as FLOW_PAT is the fix — see the header
          # of _flow-open-pr.yml for the full permission list. Unset, this falls back to
          # GITHUB_TOKEN and behaviour is exactly as before.
          token: ${{ secrets.FLOW_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Choose the task to work
        id: pick
        env:
          INPUT_ID: ${{ inputs.task_id }}
        run: |
          id="$INPUT_ID"
          if [ -z "$id" ]; then id="$(node .flow/bin/pick-task.mjs)"; fi
          if [ -z "$id" ]; then
            echo "Queue dry — no ready task with a clear blast radius. Nothing to dispatch."
            echo "task_id=" >> "$GITHUB_OUTPUT"
          else
            echo "Dispatching a worker for $id."
            echo "task_id=$id" >> "$GITHUB_OUTPUT"
          fi

      - name: Work the task (fresh worker session)
        id: work
        if: ${{ steps.pick.outputs.task_id != '' }}
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        env:
          # The worker shells out to `gh` (pr create, pr ready, issue create) and `gh` reads its
          # credential from the environment, not from the action's `github_token:` input. Without
          # this the worker inherits whatever `gh` finds — in practice nothing, so `gh pr create`
          # and `gh issue create` fail outright (the second half of what flow-0093's adopting repo
          # hit). Same expression as the checkout `token:` above, deliberately: one credential for
          # everything the worker does to this repo, so its permissions are one list to reason
          # about rather than two that can disagree.
          GH_TOKEN: ${{ secrets.FLOW_PAT || secrets.GITHUB_TOKEN }}
        with:
          # Subscription auth (Pro/Max) — uses your plan quota, not API credits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # GitHub API token for the action's git/PR operations. FLOW_PAT (a real actor, CAN-58)
          # so the worker's own branch push fires _flow-open-pr.yml on the fast path — pushes made
          # with the Actions GITHUB_TOKEN don't trigger downstream workflows (GitHub's recursion
          # guard), which left worker branches sitting PR-less until the _flow-recover sweep or a
          # human noticed. Falls back to GITHUB_TOKEN when the secret isn't set: exactly today's
          # behaviour (branch pushes silently, _flow-open-pr/_flow-recover catch up after the
          # fact). See _flow-open-pr.yml's header for the ONE FLOW_PAT permission list every
          # workflow shares (flow-0093: Contents, Pull requests, Issues and Workflows, all Read
          # and write — the worker needs every one of the four). One difference for THIS
          # consumer, and it is not about permissions:
          #   - Exposure model: open-pr/recover/sync only hand FLOW_PAT to fixed gh/git commands
          #     in deterministic run: blocks. Here it enters the worker agent's environment
          #     (bypassPermissions bash over task-file-derived prompts), and unlike the
          #     job-scoped GITHUB_TOKEN a PAT outlives the run — so use a short-expiry
          #     fine-grained PAT and rotate it; don't assume open-pr's risk profile applies.
          github_token: ${{ secrets.FLOW_PAT || secrets.GITHUB_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}   # pay-per-use alternative
          # The build role gets the strongest model — fewer blocks/kickbacks = fewer human
          # touchpoints, which is the whole point of the loop. A FULL model ID, never an alias
          # (flow-0140): an alias resolves through whatever CLI the action pin installs, and the
          # v1.0.219 pin's CLI resolved `opus` to Opus 5, a generation behind, with nothing saying
          # so. A new model is now a one-line, reviewed change here (flow-0083 makes it per-task).
          # The step after this one reports the model that actually answered.
          # Note: heavier on Max-plan quota than Sonnet.
          #
          # model + permissions go through claude_args, NOT as top-level inputs. This action version
          # has no `model` input — passing one emitted "Unexpected input(s) 'model'" and silently fell
          # back to the default Sonnet (so `model: opus` never took effect). And a headless worker has
          # nobody to approve tool prompts: without an explicit permission posture, every Bash call
          # (the git claim-push, the branch, `gh pr create`, npm/gate commands) is DENIED — the worker
          # burns its turns, claims nothing, and ends "successfully" having pushed no branch and opened
          # no PR (observed on the canary repo: 17 permission denials per run, all ready tasks left untouched).
          # `--permission-mode bypassPermissions` makes the loop autonomous on an ephemeral, trusted CI
          # runner; scope stays fenced by the task's `touches` + the touches-guard CI gate, not by
          # per-tool prompts.
          # --max-turns 120 (was 60): a full task is implement + tests-per-criterion + iterate to
          # green build/lint/test + clear the coverage floor + three review subagents + open the PR.
          # Heavier dashboard tasks consistently overran 60 (error_max_turns ~15-21min runs, no PR),
          # so the cap was failing them after real work. 120 covers the hard ones; raise further if a
          # task still caps. (Cost scales with turns — that's the trade for a finished PR over a wasted run.)
          # Before raising it again, check that the run was not fighting something else: a repeating
          # error_max_turns on the SAME task is a symptom, not a verdict on the cap. The date-only
          # `started` bug (fixed in _flow-recover.yml) had flow-recover un-claiming live tasks about a
          # minute after every claim, so each worker built against a task main said was unowned and each
          # hourly run restarted from zero — three capped runs on one task, ~$13 each, before anyone
          # suspected the cap. Raising the cap there would only have bought more expensive failures.
          # Confirm work is actually carrying forward (a branch pushed, a `notes` entry on main) before
          # concluding the task genuinely needs more turns. A task that truly cannot fit is oversized:
          # splitting it beats buying turns.
          claude_args: "--max-turns 120 --model claude-opus-5-5 --permission-mode bypassPermissions"
          prompt: |
            You are the Flow worker for a single task. Read CLAUDE.md (the protocol) and the task
            file in .flow/tasks/ whose id is "${{ steps.pick.outputs.task_id }}". Run the full loop:

            1. CLAIM: git pull --rebase; set the task to in_progress with owner + started; commit
               that task file to main and push. `started` must be the full UTC ISO datetime
               (`date -u +%Y-%m-%dT%H:%M:%SZ`), never a bare date — flow-recover ages your claim
               off that field and a date-only value reads as that morning's midnight, so the
               sweep resets the task out from under you minutes after you claim it. If the push
               is rejected, another worker claimed it — stop, do nothing further.
            2. BRANCH off latest main: flow/${{ steps.pick.outputs.task_id }}-<slug>.
            3. BUILD strictly against the task's acceptance criteria and within its declared
               `touches` — nothing more, nothing outside those globs.
            4. GATE: run the project's build/lint/test/coverage from .flow/config.yml. Fix
               failures; do not open the PR until all four pass. Do NOT run any review subagent
               — the qa, security and code-review gates are checks on the PR (flow-review.yml),
               deliberately outside your session so the work and its reviewer are not the same
               context. Your job is to make them pass, not to run them.
            5. PR: open it titled "[${{ steps.pick.outputs.task_id }}] <title>", link the task
               file, paste the acceptance checklist with the proving test for each item. STOP —
               do not merge.

            If a real decision is needed that the task didn't settle, set the task `blocked` with
            a `blocked_reason` and stop rather than guessing. Never widen scope past `touches`.

            PUSH EARLY, AND LEAVE A HANDOFF. You are running under a hard turn cap; when you hit
            it the session is killed mid-thought, with no chance to save anything. Two habits
            make that survivable instead of total loss, and CLAUDE.md's *Session hygiene* rule
            requires both of you:
              - Push your branch as soon as it has one meaningful commit, and keep pushing as you
                go. Do not save it all for PR time. A pushed branch is what flow-recover needs to
                reopen the work instead of resetting the task to `ready`; an unpushed branch dies
                with the runner.
              - Append a `notes` entry to the task file on `main` whenever you finish a
                substantial step, covering what is genuinely done, what only looks done, the
                branch name, and the exact next action. Commit it to `main` as you go — a note
                you were planning to write at the end is a note that never gets written.
            A capped run that pushed a branch and left a note costs one cycle. A capped run that
            pushed nothing costs the whole run, and the next worker starts from zero.

      # flow-0140: name the model that actually answered, read from the action's own output,
      # so a pin whose CLI resolves to a different model can never again run unreported.
      - name: Report the model that answered
        if: ${{ always() && steps.pick.outputs.task_id != '' }}
        env:
          EXECUTION_FILE: ${{ steps.work.outputs.execution_file }}
          REQUESTED_MODEL: claude-opus-5-5
          CLAUDE_STEP: worker
        run: |
          # flow-0140. claude-code-action has no output naming the model. Its `execution_file` output is
          # the SDK message stream as JSON (base-action/src/run-claude-sdk.ts at v1.0.245): the `result`
          # message's `modelUsage` is keyed by every model that answered, `assistant` messages carry
          # `message.model`, and `system`/`init` carries the model the CLI resolved. Read in that order.
          # Every value arrives through env, never an expression. Reporting only: it never fails the job.
          node - <<'FLOW_MODEL_REPORT'
          const fs = require("fs");
          const { EXECUTION_FILE: file = "", REQUESTED_MODEL: want = "", CLAUDE_STEP: step = "claude" } = process.env;
          let seen = [];
          try {
            const msgs = JSON.parse(fs.readFileSync(file, "utf8"));
            const from = (f) => [...new Set(msgs.flatMap((m) => { try { return f(m) ?? []; } catch { return []; } }))]
              .filter((v) => typeof v === "string" && /^[A-Za-z0-9][\w.:\[\]-]*$/.test(v));
            for (const f of [
              (m) => (m.type === "result" ? Object.keys(m.modelUsage ?? {}) : []),
              (m) => (m.type === "assistant" ? [m.message.model] : []),
              (m) => (m.type === "system" && m.subtype === "init" ? [m.model] : []),
            ]) { seen = from(f); if (seen.length) break; }
          } catch { seen = []; }
          const code = (v) => "`" + v + "`";
          const lines = [`### Model: ${step}`, "",
            `- requested: ${want ? code(want) : "none passed, so the CLI's default"}`,
            `- answered: ${seen.length ? seen.map(code).join(", ") : `not reported by the action (requested ${want ? code(want) : "the CLI's default"})`}`];
          if (want && seen.length && !seen.includes(want)) {
            lines.push(`- **mismatch:** requested ${code(want)}, answered by ${seen.map(code).join(", ")}`);
            console.log(`::warning::${step} requested ${want} but was answered by ${seen.join(", ")}`);
          }
          const out = lines.join("\n") + "\n\n";
          process.stdout.write(out);
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
          FLOW_MODEL_REPORT

      # The protocol's definition of a finished run is one of exactly three outcomes: a pushed
      # `flow/<id>-*` branch ahead of main, an open PR, or a `blocked` transition with a reason.
      # A worker can burn its turns, exit 0, and produce none of them (observed on
      # CandidDan/write, runs 32869817466 / 32821080230: SDK said `is_error: false`, job
      # concluded success, nothing existed to show for it) — so the job must not take the
      # worker's exit code as the verdict. This step re-derives the outcome from the remote and
      # fails the job when none of the three happened, which is what makes a wasted run visible
      # in Actions history instead of indistinguishable from a real one. It runs whether the
      # worker step passed or failed (only a cancelled run skips it): a worker that exits 0
      # having done nothing is exactly the case `if: failure()` would miss. A `notes` entry
      # alone deliberately does NOT count — a note warms up the next worker, but it is not a
      # finished or blocked outcome (see flow-0025 / issue #33). flow-recover still owns
      # healing the claim; this step only stops the run from lying about its own result.
      - name: Verify the worker produced an outcome
        # `id:` so the facts derived below survive the step. They are the same three facts that
        # decide what `Explain what happens to the claim` has to say, and until flow-0049 they
        # were shell locals this step threw away — leaving the notice to print a hypothetical
        # from a job that already knew the answer.
        id: verify
        if: ${{ !cancelled() && steps.pick.outputs.task_id != '' }}
        env:
          TASK_ID: ${{ steps.pick.outputs.task_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bootstrap guard: the helper lives in the consuming repo once it adopts the template.
          # A repo that hasn't synced it yet must not have its queue-runner start failing here.
          if [ ! -f .flow/bin/queue-runner-verify.mjs ]; then
            echo "No .flow/bin/queue-runner-verify.mjs in this repo yet — skipping outcome verification."
            exit 0
          fi
          # Everything the worker produced landed on the remote after this job's checkout, so
          # every fact is read from origin, never from the local worktree the worker mutated.
          git fetch -q origin main
          branch="$(git ls-remote --heads origin "flow/$TASK_ID-*" | head -1 | sed 's#.*refs/heads/##')"
          if [ -n "$branch" ]; then
            branch_exists=1
            git fetch -q origin "$branch"
            ahead="$(git rev-list --count origin/main..FETCH_HEAD)"
            has_open_pr="$(gh pr list --head "$branch" --state open --json number --jq 'length')"
          else
            branch_exists=0; ahead=0; has_open_pr=0
          fi
          # A cloud/harness worker can be forced onto a non-flow/ branch; the protocol makes
          # the [<id>] PR-title prefix load-bearing for exactly that case, so check it too.
          # Filtered in node with the id passed via the environment — not interpolated into a
          # jq program — because workflow_dispatch task ids are untrusted input.
          if [ "$has_open_pr" = "0" ]; then
            has_open_pr="$(gh pr list --state open --json title | node -e '
              const prs = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              const prefix = "[" + process.env.TASK_ID + "]";
              process.stdout.write(String(prs.filter((p) => p.title.startsWith(prefix)).length));
            ')"
          fi
          # Publish the facts BEFORE the verdict below, never after: the helper exits non-zero on
          # a wasted run, and a `run:` block stops at the first failing command — so outputs
          # written after it would be missing on exactly the path that needs them. `facts_known`
          # is the flag the explain step keys off; the bootstrap guard above returns early, so an
          # unsynced repo publishes nothing and that step falls back to its generic text.
          # `branch` comes from `git ls-remote | sed` and is a single ref name by construction
          # (refs cannot contain whitespace or newlines), so it cannot forge extra output lines.
          {
            echo "facts_known=1"
            echo "branch=$branch"
            echo "branch_exists=$branch_exists"
            echo "ahead=$ahead"
            echo "has_open_pr=$has_open_pr"
          } >> "$GITHUB_OUTPUT"
          # The task's state lives on main, which moved after checkout if the worker claimed or
          # blocked it — refresh the store from origin/main so the helper reads current state.
          git checkout -q origin/main -- .flow/tasks/
          node .flow/bin/queue-runner-verify.mjs --task-id "$TASK_ID" \
            --branch-exists "$branch_exists" --ahead "$ahead" --has-open-pr "$has_open_pr"

      # A capped/failed worker exits non-zero having opened no PR, and the raw log says only
      # "Claude execution failed". State the consequence explicitly so the run is diagnosable
      # from the summary alone: the claim is NOT released here, and must not be — releasing it
      # from the failure path would race a worker that is still finishing. flow-recover owns
      # that decision, on its own schedule, from the evidence on the remote.
      #
      # `if: failure()` is ANY step failing, not specifically a worker that produced nothing, so
      # this step must not assert an absence it never checked: a worker that pushes, opens its
      # PR and *then* exits non-zero fires this step too. It therefore renders the outcome the
      # verify step above actually observed (`renderClaimNotice`, colocated with the decision it
      # describes) rather than the two-branch hypothetical it used to print.
      - name: Explain what happens to the claim
        if: ${{ failure() && steps.pick.outputs.task_id != '' }}
        env:
          TASK_ID: ${{ steps.pick.outputs.task_id }}
          FACTS_KNOWN: ${{ steps.verify.outputs.facts_known }}
          BRANCH: ${{ steps.verify.outputs.branch }}
          BRANCH_EXISTS: ${{ steps.verify.outputs.branch_exists }}
          AHEAD: ${{ steps.verify.outputs.ahead }}
          HAS_OPEN_PR: ${{ steps.verify.outputs.has_open_pr }}
        run: |
          # No facts, no claim about them. Two ways to get here: the repo has not synced the
          # helper yet (the verify step's bootstrap guard no-ops, publishing nothing, and there
          # is no renderer to call either), or that step died before publishing. Both fall back
          # to the generic two-branch text — which is honest when the outcome is genuinely
          # unknown, and is the only copy of it, so the two paths cannot drift.
          if [ "$FACTS_KNOWN" != "1" ] || [ ! -f .flow/bin/queue-runner-verify.mjs ]; then
            {
              echo "### Worker run failed for \`$TASK_ID\`"
              echo
              echo "The claim on \`$TASK_ID\` is left as-is — **flow-recover** resolves it on the"
              echo "next sweep, and which way it goes depends on what this run managed to push:"
              echo
              echo "- **branch pushed, ahead of \`main\`** → the PR is re-opened from that branch,"
              echo "  and the work survives."
              echo "- **nothing pushed** → the task resets to \`ready\` once it passes the staleness"
              echo "  threshold, and the next queue-runner starts it over from zero."
              echo
              echo "If this is the same task capping repeatedly, the cap is the symptom to look"
              echo "past, not the thing to raise: check that a branch and a \`notes\` entry are"
              echo "actually landing between runs, then consider splitting the task."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node .flow/bin/queue-runner-verify.mjs --mode explain --task-id "$TASK_ID" \
            --branch "$BRANCH" --branch-exists "$BRANCH_EXISTS" --ahead "$AHEAD" \
            --has-open-pr "$HAS_OPEN_PR" >> "$GITHUB_STEP_SUMMARY"
