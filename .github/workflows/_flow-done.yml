name: _flow-done (reusable)

# Reusable form of the merge-closes-the-lifecycle transition. Repos call it from a thin
# caller; the logic is authored once in canonical. See docs/flow-reusable-workflows.md.
#
# A task's `done` transition is owned by the merge, not the worker — the worker only ever
# goes as far as `in_review`. When a flow/<id>-… PR merges into main, this flips the matching
# task to `done` on main (the store's home) and commits it. Board regeneration is left to the
# next board-builder run; the canonical state is correct immediately.

on:
  workflow_call:

permissions:
  contents: write

jobs:
  mark-done:
    # Only on a real merge — not on a closed-without-merge. No branch-name gate: a cloud
    # session's non-flow/ branch must still flip to done. The id is resolved from the branch
    # OR the PR title (CAN-52); the step no-ops cleanly when neither carries one.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Flip the merged task to done
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          # Branch name first (canonical), PR title second (CAN-52 fallback for non-flow/ branches).
          # The job checks out `main`; the helper lives there once the repo adopts the template.
          # Guard its presence (so a bootstrap PR no-ops cleanly) and keep the call non-fatal under set -e.
          id=""
          if [ -f .flow/bin/parse-task-id.mjs ]; then
            id="$(node .flow/bin/parse-task-id.mjs "$HEAD_REF" "$PR_TITLE" || true)"
          fi
          if [ -z "$id" ]; then
            echo "Could not parse a task id from branch '$HEAD_REF' or title '$PR_TITLE' — nothing to mark done."
            exit 0
          fi
          echo "Marking $id done (PR #$PR_NUM merged)."
          printf '{"updates":[{"id":"%s","status":"done"}]}\n' "$id" > .flow/board-edits.json
          node .flow/bin/apply-board-edits.mjs

          if git diff --quiet -- .flow/tasks/; then
            echo "No state change for $id (already done, or not found) — nothing to commit."
            exit 0
          fi
          git config user.name  "flow-bot"
          git config user.email "flow-bot@users.noreply.github.com"
          git add .flow/tasks/
          git commit -m "flow: $id -> done (PR #$PR_NUM merged)"
          git push origin main
