name: flow-unblock

# Canonical's own caller of the blocked-task release sweep (flow-0041). Referenced from `main`
# rather than a tag — see flow-gates.yml in this directory for why canonical is the one repo where
# that is the safer pin.
#
# Releases every `blocked` task whose `blocked_by` entries have ALL resolved, and stops there: it
# starts no worker (flow-0173) — the next worker run picks the released task. No model in the
# loop: it costs seconds.
#
# Two triggers, one job — the reusable is trigger-agnostic:
#   · workflow_run on flow-done completing, so a dependent is released about a minute after its
#     dependency merges;
#   · workflow_dispatch, on demand — for a block written after its dependency already landed, or a
#     missed flow-done run.
# No schedule (flow-0185): a `blocked_by` entry resolves only when flow-done runs, and the hourly
# backstop cost about 720 billed Actions minutes a month in an idle repo. After a release is pushed,
# the reusable sends repository_dispatch `flow-task-state`, which starts flow-dispatch.
#
# NOT gated on FLOW_AI (see the reusable's header). A permissions block is exhaustive:
# `contents: write` for the release commit and `pull-requests: read` for the blocked_by PR lookup,
# and nothing else is granted.
# No secrets: the reusable uses GITHUB_TOKEN only.

on:
  workflow_run:
    workflows: [flow-done]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: flow-unblock
  cancel-in-progress: false

jobs:
  flow-unblock:
    permissions:
      contents: write          # the release commit to main
      pull-requests: read      # the blocked_by PR lookup, so a PR-url block releases on merge
    uses: CandidDan/flow/.github/workflows/_flow-unblock.yml@main
