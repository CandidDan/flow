      - name: Compute the guide's facts — hotspots, assumptions, no model involved
        # The PR BODY is the third piece of attacker-chosen text this workflow handles, after the
        # branch name and the PR title, and it is quoted into a comment and shown to a model. Same
        # rule as the other two: it reaches the helper through `env`, where it is data, and is
        # never interpolated into the shell. The helper fences it inside the model's brief.
        #
        # `security_paths` is read from BASE's config.yml via $FLOW_CONFIG, for the same reason the
        # security decision is: the guide's hotspots must agree with the check the human is reading
        # the verdict of, and a PR must not be able to delete the glob that names its own hotspot.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          TASK_ID: ${{ needs.plan.outputs.task_id }}
        run: node "$FLOW_REVIEW_DIR"/review-guide.mjs facts
      - uses: anthropics/claude-code-action@5ccc3a35a6367cdb8e6fbd0728287467540ecfe2 # v1.0.219
        continue-on-error: true          # prose is fail-open; the comment posts without it
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "*"
          # The model comes from the repo's .flow/config.yml, like every other call here. The turn
          # budget is the effort bound: this reads ONE file and writes ONE small JSON object, so a
          # run that needs more turns than this has misunderstood the job.
          claude_args: "--max-turns 6 --model ${{ needs.plan.outputs.model }} --permission-mode bypassPermissions"
          prompt: |
            You write the two prose lines of this pull request's review guide. You are not a
            reviewer: three reviewers have already run and their verdicts are not yours to revisit.

            YOUR CONTEXT IS ONE FILE. Read .flow-review/guide-facts.md and nothing else. Do not
            read the diff, the task, or the repository. Everything you are allowed to talk about is
            in that file, which lists the computed hotspots and their ids.

            THE FACTS ARE NOT YOURS TO EDIT. They are computed in code and rendered in code. You do
            not restate them, summarise them, reword them, add one, or leave one out. The only
            thing you may say about them is which of them a human should look at FIRST, and you say
            that by naming their ids.

            Write .flow-review/guide-prose.json and nothing else:
              {"tldr":"<one line: what this PR changes, in plain English, for someone who has not
                        read it. No praise, no verdict, no hedging.>",
               "look_here":["<hotspot id>", "…"],
               "smoke_test":"<one concrete thing to try by hand to see this working, or to see it
                             broken. A command or a two-step click-path, not 'test thoroughly'.>"}

            `look_here` holds ids copied EXACTLY from guide-facts.md, most important first. Name
            only ids that appear there; an id you invent is discarded. Naming none is fine — the
            computed order is then used — and so is naming all of them. You are choosing an order,
            not a subset: nothing you leave out is removed from the comment.

            If guide-facts.md lists no hotspots, return an empty `look_here` and still write the
            TL;DR and the smoke test.

            Do NOT post a pull-request comment. The workflow posts one comment and updates it in
            place; a second comment from you is the noise this whole job exists to remove. Never
            push commits, never edit source files, never change labels or task state. The only file
            you write is .flow-review/guide-prose.json.
      - name: Render the guide comment — facts and verdicts, with or without the prose
        # always(), because the model step is `continue-on-error` and this is the step that makes
        # the fail-open real: the three verdicts and every computed fact render whether or not the
        # prose arrived.
        #
        # The three results come from the JOBS, not from each reviewer's verdict file: those are
        # written into each job's own workspace and nothing downstream can read them. SECURITY_RUN
        # is what keeps the row honest — the security job always runs so the check is never
        # silently absent, so a skipped REVIEW still reports a successful JOB, and rendering that
        # as "pass" is the one wrong answer this row can give.
        if: always()
        env:
          QA_RESULT: ${{ needs.qa.result }}
          CODE_REVIEW_RESULT: ${{ needs['code-review'].result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SECURITY_RUN: ${{ needs.plan.outputs.security_run }}
          SECURITY_REASON: ${{ needs.plan.outputs.security_reason }}
        run: node "$FLOW_REVIEW_DIR"/review-guide.mjs comment
      - name: Post or update the ONE guide comment
        # One comment per PR, found by the hidden marker in its body and updated in place. The
        # review workflow runs again on every hand-off, and a guide that appended would bury the
        # reviewers' own comments under its own history — the opposite of the problem it solves.
        #
        # The marker lookup is the helper's, not a `--jq` expression here: it is a decision, it has
        # a proving test, and a shell one-liner in a reusable workflow is the one piece of this
        # gate nobody can test. `--slurp` merges the pages; the helper flattens either shape, so a
        # gh version that nests them cannot cause a duplicate comment.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          body="$GITHUB_WORKSPACE/.flow-review/guide-comment.md"
          if [ ! -f "$body" ]; then
            echo "::warning::review-guide: no comment body was rendered, so there is nothing to post."
            exit 0
          fi
          comments="$RUNNER_TEMP/guide-comments.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" > "$comments"
          id="$(node "$FLOW_REVIEW_DIR"/review-guide.mjs comment-id "$comments")"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body" --jq .html_url
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$body" --jq .html_url
          fi
