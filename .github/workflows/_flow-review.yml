name: _flow-review (reusable)

# The three Definition-of-Done reviewers — qa, code-review, security — as CHECKS ON THE PR
# (flow-0007). They used to run as subagents inside the worker's own session, which made the
# worker the certifier of its own work: same context, same assumptions, same blind spots. Every
# other guard in Flow refuses to take the worker's word for it — touches-guard enforces scope in
# CI, the store-guard fails a PR that edits task state, flow-doctor validates the store rather
# than trusting it. These now work the same way.
#
# Portability follows from the integrity fix rather than the other way round: the reviewer is
# still a model call and still Claude. What changes is that THE WORKER no longer has to be the
# same vendor as the reviewer — a PR from any agent, or from a human, gets the identical checks.
#
# Repos call this from a thin caller that owns the pull_request trigger; the logic is authored
# once in canonical. See docs/flow-reusable-workflows.md.
#
# WHAT IS NOT A MODEL CALL. A model call always exits 0, so the two pieces that actually block
# live in `.flow/bin/flow-review.mjs`, with proving tests:
#   · `plan`    — reads `review:` from the CALLER's .flow/config.yml (model, security trigger
#                 paths), decides whether the conditional security review applies to this diff,
#                 and materialises the bounded context the reviewers may read.
#   · `verdict` — turns each reviewer's written verdict into an exit code, FAIL-CLOSED: a
#                 missing, empty or unparseable verdict fails the check. A reviewer that died
#                 mid-run must never read as an approval.
#
# NO MODEL IS NAMED IN THIS FILE. `review.model` / `review.security_model` in the consuming
# repo's .flow/config.yml decide it — data the project tunes, not shared infra it has to patch.
#
# BLOCKING. These three block, in the same way a failed test blocks. Keep advisory reviewers
# (e.g. GitHub Copilot code review, enabled repo-side) advisory: two blocking AI reviewers
# deadlock on nitpicks, which the README already warns about.
#
# DISABLED BY DEFAULT. Enable with repo variable FLOW_AI=true + the CLAUDE_CODE_OAUTH_TOKEN
# secret (from `claude setup-token` — uses your Max plan quota, not API credits). The thin
# caller passes it by name, not `secrets: inherit`.
#
# THE FORK BOUNDARY IS FENCED HERE, NOT INHERITED. GitHub withholds secrets from a `pull_request`
# run on a fork PR, so the reviewers could never authenticate there — but they still STARTED:
# three jobs checked out the PR head and ran `node .flow/bin/flow-review.mjs` FROM THAT HEAD
# before claude-code-action was reached. Under `pull_request` the platform contains that. The
# problem is that the containment is a property of a file this workflow does not own: THE THIN
# CALLER OWNS THE TRIGGER, in the adopting repo, at a tag it has already pinned. A caller edited
# to `pull_request_target` — which looks like a fix for "our fork PRs get no review" — would hand
# fork-authored code and a fork-authored diff to three jobs running `--permission-mode
# bypassPermissions` with this workflow's `pull-requests: write`, `id-token: write` and a real
# CLAUDE_CODE_OAUTH_TOKEN. Canonical cannot patch that downstream, so `plan` compares the head
# repo against this one and the fence holds whatever the caller does. Review fork contributions
# on a branch in the repo.
#
# THE GATE IS EXECUTED FROM THE BASE BRANCH, NOT FROM THE PR (flow-0079). `plan` used to run
# `node .flow/bin/flow-review.mjs` out of the PR checkout, reading `.flow/config.yml` from that
# same checkout — so both the code that decides and the config that scopes it were controlled by
# the diff being decided about. A PR could delete the `review.security_paths` glob covering its
# own change and the security review would skip, "visibly", with a reason that read as legitimate;
# a PR could edit `verdict` itself, which is the code that turns a reviewer's words into a red
# check. flow-0068 fenced FORK PRs; this is the same hole for PRs from inside the repo, which is
# every PR the queue runner opens. So each job now materialises the base branch in a scratch
# worktree under RUNNER_TEMP and runs THAT helper against THAT config, while the diff, the changed
# files and the task still come from the PR. A worktree rather than a `git show` of the one file,
# because the helper is not one file: it imports touches-guard.mjs and parse-task-id.mjs, and in
# canonical it is an adapter over project-template/.flow/bin/. Materialising the tree is what
# makes "the base branch's copy" mean the whole of it.
#
# THE SECURITY FLOOR is the other half. Even read from base, `security_paths` is a list a repo can
# legitimately scope tightly — so `.flow/**`, `.github/**`, `.claude/**`, `CLAUDE.md` and
# `AGENTS.md` trigger the security review regardless of it. Those are the paths that decide what
# every gate does; a repo scoping its product code is not asking for its CI to be unreviewable.
# The floor lives in the helper (`SECURITY_FLOOR_PATHS`), not here, so it is testable.
#
# BOOTSTRAP. A repo adopting the review gate in this very PR has no gate on base to plan from.
# That case uses the PR's own helper, FORCES the security review on, and says so in the run
# summary. Fail-closed, never skipped, and never silent.
#
# This is NOT an author fence, and the distinction is criterion 6 of flow-0007. `allowed_bots: "*"`
# stays, nothing inspects who triggered the run or what the branch is called, and a PR from a
# human or a non-Claude agent gets the identical checks. What is fenced is whose CODE the runner
# executes. (The two expressions that would re-fence authorship are named in
# flow-review-workflow.test.mjs, which forbids them anywhere in this file — including in a comment
# like this one, which is why it describes them instead of quoting them.)

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node used to run .flow/bin/flow-review.mjs (the helper is dependency-free)."
        required: false
        type: string
        default: "22"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write          # OIDC token minting for claude-code-action

jobs:
  # ── plan ───────────────────────────────────────────────────────────────────────────────
  # Reads the repo's own review config and decides the conditional security review, once, so
  # every reviewer below runs on the same decision and the human sees it in the run summary.
  plan:
    # The draft clause is flow-0039, and it is the single gate for all four jobs: `qa`,
    # `code-review` and `security` each declare `needs: plan`, so suppressing `plan` suppresses
    # them. Without it the three Definition-of-Done reviewers ran on `opened` — which flow-open-pr
    # triggers on the FIRST push — and again on every `synchronize`, i.e. three agent invocations
    # per work-in-progress push against code the worker had not finished writing. The caller lists
    # `ready_for_review` in its `types:`, so the reviewers fire once, when the worker hands off.
    # `github.event.pull_request.draft` is present on every `pull_request` event; on any other event
    # it is empty, which is why this compares against 'true' rather than testing for false.
    #
    # The third clause is the fork fence (see the header). `plan` is the only place it belongs:
    # the other three jobs declare `needs: plan`, so suppressing this suppresses all of them,
    # and `security` keeps no job-level `if` of its own — one that vanished from the PR on a skip
    # is indistinguishable from a gate that broke.
    if: ${{ vars.FLOW_AI == 'true' && github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.plan.outputs.model }}
      security_model: ${{ steps.plan.outputs.security_model }}
      security_run: ${{ steps.plan.outputs.security_run }}
      security_reason: ${{ steps.plan.outputs.security_reason }}
      task_id: ${{ steps.plan.outputs.task_id }}
      # flow-0103. The truncation fact, decided ONCE here and read by all three verdict steps, so
      # a PASS on a diff the plan clipped cannot clear a check. It is published as a job output
      # rather than read from each reviewer's own bounded-context step for two reasons: the three
      # checks must agree about what was reviewed, and the reviewer itself writes into the
      # workspace — a fact it could overwrite is not a fact. The byte counts are reporting only.
      diff_truncated: ${{ steps.plan.outputs.diff_truncated }}
      diff_bytes: ${{ steps.plan.outputs.diff_bytes }}
      diff_full_bytes: ${{ steps.plan.outputs.diff_full_bytes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Materialise the review gate from the BASE branch
        # flow-0079. Everything that DECIDES comes from base; everything that is DECIDED ABOUT
        # comes from the PR. The env vars written below are what keeps those two apart —
        # `FLOW_REVIEW_DIR` + `FLOW_CONFIG` + `REVIEW_TASKS_DIR` (the task file and its acceptance
        # criteria, flow-0085) point at base, `REVIEW_REPO_DIR` / `REVIEW_OUT_DIR` point back at
        # the PR checkout. `REVIEW_REPO_DIR` is load-bearing for
        # a repo whose `.flow/bin/flow-review.mjs` is an ADAPTER (canonical's is): an adapter pins
        # its git to its own realpath, which inside the base worktree would diff base against
        # itself and hand the reviewers an empty patch.
        #
        # The branch name reaches the shell through `env:`, not `${{ }}` — same rule as the PR
        # title and `security_reason`. A ref name is less attacker-chosen than a title, but the
        # rule is cheaper to keep than to reason about case by case.
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -eu
          git fetch -q origin "$BASE_BRANCH"
          base_dir="$RUNNER_TEMP/flow-review-base"
          rm -rf "$base_dir"
          git worktree prune
          if git cat-file -e "origin/$BASE_BRANCH:.flow/bin/flow-review.mjs" 2>/dev/null \
             && git cat-file -e "origin/$BASE_BRANCH:.flow/config.yml" 2>/dev/null; then
            git worktree add -q --detach "$base_dir" "origin/$BASE_BRANCH"
            {
              echo "FLOW_REVIEW_DIR=$base_dir/.flow/bin"
              echo "FLOW_CONFIG=$base_dir/.flow/config.yml"
              # flow-0085: the task file is the STANDARD the PR is judged against, so it comes
              # from base too. A PR that edits its own acceptance criteria must not hand the
              # reviewers the edited copy.
              echo "REVIEW_TASKS_DIR=$base_dir/.flow/tasks"
            } >> "$GITHUB_ENV"
          elif [ -f .flow/bin/flow-review.mjs ]; then
            # BOOTSTRAP — this PR is the one adopting the gate. The helper below forces the
            # security review on (REVIEW_BOOTSTRAP) and repeats this warning in the plan summary.
            {
              echo "FLOW_REVIEW_DIR=$GITHUB_WORKSPACE/.flow/bin"
              echo "REVIEW_BOOTSTRAP=1"
              # No independent copy exists on base, so the task file can only come from the PR.
              echo "REVIEW_TASKS_DIR=$GITHUB_WORKSPACE/.flow/tasks"
            } >> "$GITHUB_ENV"
            echo "::warning::BOOTSTRAP: the base branch carries no review gate, so this PR's own" \
                 "copy is planning the review of this PR. The security review is forced on."
            printf '### Flow review gate — :warning: BOOTSTRAP\n\n%s\n\n' \
              'The base branch carries no `.flow/bin/flow-review.mjs` and/or no `.flow/config.yml`, so the gate was planned from THIS PR rather than from an independent copy. The security review is forced on. Expected exactly once, on the PR that adopts the review gate.' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            # Neither base nor this PR has the helper: an adopting repo that bumped the workflow
            # tag but has not run flow-sync. Say so, instead of failing on "node: not found".
            echo "::error::.flow/bin/flow-review.mjs is missing from this PR and from the base" \
                 "branch. This repo adopted a newer _flow-review.yml than its .flow/bin/ — run" \
                 "the flow-sync workflow to adopt the helper, then re-run these checks."
            exit 1
          fi
          {
            echo "REVIEW_REPO_DIR=$GITHUB_WORKSPACE"
            echo "REVIEW_OUT_DIR=$GITHUB_WORKSPACE/.flow-review"
          } >> "$GITHUB_ENV"
      - name: Plan the review — model, security trigger, bounded context
        id: plan
        env:
          BASE_REF: origin/${{ github.base_ref }}
          # CAN-52: the task id has two sources and the helper resolves both in code. The branch
          # arrives as `github.head_ref` — the underscore form, deliberately. The dotted
          # `pull_request` spelling of the same value is forbidden ANYWHERE in this file by
          # `flow-review-workflow.test.mjs`, so that a real branch fence cannot be smuggled in
          # behind an id lookup; that test refuses prose too, which is why this comment does not
          # spell it either. A branch NAME here is an id source, never a gate. The PR title is
          # attacker-controlled text: it travels through `env`, where it is data, and is never
          # interpolated into the shell.
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node "$FLOW_REVIEW_DIR"/flow-review.mjs plan

  # Each reviewer below re-runs `plan` to materialise its own .flow-review/ rather than taking
  # an artifact from the plan job. Two git diffs are cheaper than an upload/download round trip,
  # and it keeps two more third-party actions out of the supply chain every adopting repo
  # inherits — the concern .flow/config.yml lists under `uses:` pins.

  # ── qa ─────────────────────────────────────────────────────────────────────────────────
  # The real correctness gate: every acceptance criterion has a test that asserts its OUTCOME.
  # Coverage and the command exits are backstops — a green coverage number with an unproven
  # criterion is still a FAIL.
  qa:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Materialise the review gate from the BASE branch
        # flow-0079. Everything that DECIDES comes from base; everything that is DECIDED ABOUT
        # comes from the PR. The env vars written below are what keeps those two apart —
        # `FLOW_REVIEW_DIR` + `FLOW_CONFIG` + `REVIEW_TASKS_DIR` (the task file and its acceptance
        # criteria, flow-0085) point at base, `REVIEW_REPO_DIR` / `REVIEW_OUT_DIR` point back at
        # the PR checkout. `REVIEW_REPO_DIR` is load-bearing for
        # a repo whose `.flow/bin/flow-review.mjs` is an ADAPTER (canonical's is): an adapter pins
        # its git to its own realpath, which inside the base worktree would diff base against
        # itself and hand the reviewers an empty patch.
        #
        # The branch name reaches the shell through `env:`, not `${{ }}` — same rule as the PR
        # title and `security_reason`. A ref name is less attacker-chosen than a title, but the
        # rule is cheaper to keep than to reason about case by case.
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -eu
          git fetch -q origin "$BASE_BRANCH"
          base_dir="$RUNNER_TEMP/flow-review-base"
          rm -rf "$base_dir"
          git worktree prune
          if git cat-file -e "origin/$BASE_BRANCH:.flow/bin/flow-review.mjs" 2>/dev/null \
             && git cat-file -e "origin/$BASE_BRANCH:.flow/config.yml" 2>/dev/null; then
            git worktree add -q --detach "$base_dir" "origin/$BASE_BRANCH"
            {
              echo "FLOW_REVIEW_DIR=$base_dir/.flow/bin"
              echo "FLOW_CONFIG=$base_dir/.flow/config.yml"
              # flow-0085: the task file is the STANDARD the PR is judged against, so it comes
              # from base too. A PR that edits its own acceptance criteria must not hand the
              # reviewers the edited copy.
              echo "REVIEW_TASKS_DIR=$base_dir/.flow/tasks"
            } >> "$GITHUB_ENV"
          elif [ -f .flow/bin/flow-review.mjs ]; then
            # BOOTSTRAP — this PR is the one adopting the gate. The helper below forces the
            # security review on (REVIEW_BOOTSTRAP) and repeats this warning in the plan summary.
            {
              echo "FLOW_REVIEW_DIR=$GITHUB_WORKSPACE/.flow/bin"
              echo "REVIEW_BOOTSTRAP=1"
              # No independent copy exists on base, so the task file can only come from the PR.
              echo "REVIEW_TASKS_DIR=$GITHUB_WORKSPACE/.flow/tasks"
            } >> "$GITHUB_ENV"
            echo "::warning::BOOTSTRAP: the base branch carries no review gate, so this PR's own" \
                 "copy is planning the review of this PR. The security review is forced on."
            printf '### Flow review gate — :warning: BOOTSTRAP\n\n%s\n\n' \
              'The base branch carries no `.flow/bin/flow-review.mjs` and/or no `.flow/config.yml`, so the gate was planned from THIS PR rather than from an independent copy. The security review is forced on. Expected exactly once, on the PR that adopts the review gate.' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            # Neither base nor this PR has the helper: an adopting repo that bumped the workflow
            # tag but has not run flow-sync. Say so, instead of failing on "node: not found".
            echo "::error::.flow/bin/flow-review.mjs is missing from this PR and from the base" \
                 "branch. This repo adopted a newer _flow-review.yml than its .flow/bin/ — run" \
                 "the flow-sync workflow to adopt the helper, then re-run these checks."
            exit 1
          fi
          {
            echo "REVIEW_REPO_DIR=$GITHUB_WORKSPACE"
            echo "REVIEW_OUT_DIR=$GITHUB_WORKSPACE/.flow-review"
          } >> "$GITHUB_ENV"
      - name: Bounded context — the diff and the files it changes
        env:
          BASE_REF: origin/${{ github.base_ref }}
          # CAN-52: the task id has two sources and the helper resolves both in code. The branch
          # arrives as `github.head_ref` — the underscore form, deliberately. The dotted
          # `pull_request` spelling of the same value is forbidden ANYWHERE in this file by
          # `flow-review-workflow.test.mjs`, so that a real branch fence cannot be smuggled in
          # behind an id lookup; that test refuses prose too, which is why this comment does not
          # spell it either. A branch NAME here is an id source, never a gate. The PR title is
          # attacker-controlled text: it travels through `env`, where it is data, and is never
          # interpolated into the shell.
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node "$FLOW_REVIEW_DIR"/flow-review.mjs plan
      - uses: anthropics/claude-code-action@5ccc3a35a6367cdb8e6fbd0728287467540ecfe2 # v1.0.219
        continue-on-error: true          # the verdict step below decides; never this action's exit
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Flow worker PRs are opened by a bot, so the reviewer must accept a bot-initiated run.
          # This is also what makes criterion 6 true: the checks do not care who authored the PR.
          allowed_bots: "*"
          # The model comes from the repo's .flow/config.yml. Nothing here names one.
          claude_args: "--max-turns 60 --model ${{ needs.plan.outputs.model }} --permission-mode bypassPermissions"
          prompt: |
            You are the QA gate for this pull request. You did not write this code and owe it
            nothing. You do not write feature code; you decide pass/fail, and you are hard to fool.

            YOUR CONTEXT IS BOUNDED — this is a cost control, not a suggestion. Read:
              · .flow-review/diff.patch  — the full PR diff
              · .flow-review/files.txt   — the files it changes
              · .flow-review/task.md     — THE TASK, and its acceptance criteria. The gate has
                already resolved it in code from the branch (flow/<id>-…) or, when the platform
                forced a non-flow/ branch, the PR title prefix ([<id>] …). Read the criteria from
                here; do not go hunting for the file in .flow/tasks/ yourself.
              · .flow/config.yml for this project's commands
              · the specific test files the diff adds or changes
            Do NOT read the repository at large.
            If the diff carries the DIFF TRUNCATED marker, do NOT return a PASS verdict: name
            the truncation in your verdict and in its summary, because passing a partial read
            certifies what you could not read.

            .flow-review/task.md may instead begin with one of two sentinels that mean this PR
            has NO TASK BY DESIGN. Both are decided in code — branch prefix AND every changed
            path inside a closed list — so neither is a branch-name exemption, and neither is a
            judgement call for you:
              · "RELEASE PR" — release files only. The sentinel carries release-guard's verdict
                over this tree. If it reports no problems, PASS with exactly: release PR: release
                files only, release-guard clean. If it reports problems, FAIL and name them.
              · "SYNC PR" — the flow-sync surface only. The classification proves where the files
                are, not where their content came from, so still read the diff. If it adds or
                widens a `permissions:` block, introduces `pull_request_target`, points a `uses:`
                at a different owner or an unpinned branch, or changes how a secret is read or
                passed, FAIL and name it. Otherwise PASS with exactly: sync PR: synced surface
                only; flow-tooling validates it.
            Under either sentinel there are no acceptance criteria to map, and a missing task is
            not a finding. Do not go looking for one.

            Your verdict turns on ONE thing above all: does every acceptance criterion in the
            task have a test that proves its OUTCOME? Coverage is a backstop — a green coverage
            number with an unproven criterion is still a FAIL. For each criterion, name the
            test (file::name) that exercises it, and check the test asserts the criterion's
            outcome rather than merely that the code runs without throwing. A test that calls a
            function and asserts nothing meaningful does not prove anything.

            .flow-review/task.md begins with one of two sentinels when it carries no task, and
            they ask you for OPPOSITE things — read which one it is before reacting:
              · "NO TASK FILE RESOLVED" — the sources were checked and carry no task. Say so
                plainly; there are no criteria to map, so do not report a criterion→test table
                you were not in a position to build.
              · "TASK CONTEXT UNAVAILABLE" — the sources were never supplied to the gate, so
                nothing has been checked. Do NOT report a missing task. Locate it yourself from
                the branch or the PR title; if you cannot, say the task CONTEXT was unavailable
                and name that sentinel, which is what tells a human to run flow-sync.
            The file itself states which case applies and why.

            THEN DO BOTH OF THESE:
            1. Post ONE pull-request comment: the verdict, the criterion→test table, and for a
               FAIL the smallest set of concrete things needed to pass. No boilerplate praise.
            2. Write .flow-review/qa.json — this is what blocks or clears the check:
               {"verdict":"PASS"|"FAIL",
                "unproven":["<the criterion text, verbatim, for each with no proving test>"],
                "summary":"<one line>"}
               `unproven` must quote the criterion so the worker knows which one to fix.

            You review only. Never push commits, never edit source files, never change labels or
            task state. The only file you write is .flow-review/qa.json.
      - name: Enforce the qa verdict
        if: always()
        # flow-0103: the plan's truncation fact, from the plan job's output. Through `env:` rather
        # than `${{ }}` in the script, the same rule the PR title and `security_reason` follow —
        # cheaper to keep than to re-argue per value. The flag is REQUIRED by the helper, so an
        # empty value here fails the check rather than passing a partly-read diff.
        env:
          DIFF_TRUNCATED: ${{ needs.plan.outputs.diff_truncated }}
          DIFF_BYTES: ${{ needs.plan.outputs.diff_bytes }}
          DIFF_FULL_BYTES: ${{ needs.plan.outputs.diff_full_bytes }}
        run: >-
          node "$FLOW_REVIEW_DIR"/flow-review.mjs verdict .flow-review/qa.json --check qa
          --diff-truncated "$DIFF_TRUNCATED"
          --diff-bytes "$DIFF_BYTES" --diff-full-bytes "$DIFF_FULL_BYTES"

  # ── code-review ────────────────────────────────────────────────────────────────────────
  code-review:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Materialise the review gate from the BASE branch
        # flow-0079. Everything that DECIDES comes from base; everything that is DECIDED ABOUT
        # comes from the PR. The env vars written below are what keeps those two apart —
        # `FLOW_REVIEW_DIR` + `FLOW_CONFIG` + `REVIEW_TASKS_DIR` (the task file and its acceptance
        # criteria, flow-0085) point at base, `REVIEW_REPO_DIR` / `REVIEW_OUT_DIR` point back at
        # the PR checkout. `REVIEW_REPO_DIR` is load-bearing for
        # a repo whose `.flow/bin/flow-review.mjs` is an ADAPTER (canonical's is): an adapter pins
        # its git to its own realpath, which inside the base worktree would diff base against
        # itself and hand the reviewers an empty patch.
        #
        # The branch name reaches the shell through `env:`, not `${{ }}` — same rule as the PR
        # title and `security_reason`. A ref name is less attacker-chosen than a title, but the
        # rule is cheaper to keep than to reason about case by case.
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -eu
          git fetch -q origin "$BASE_BRANCH"
          base_dir="$RUNNER_TEMP/flow-review-base"
          rm -rf "$base_dir"
          git worktree prune
          if git cat-file -e "origin/$BASE_BRANCH:.flow/bin/flow-review.mjs" 2>/dev/null \
             && git cat-file -e "origin/$BASE_BRANCH:.flow/config.yml" 2>/dev/null; then
            git worktree add -q --detach "$base_dir" "origin/$BASE_BRANCH"
            {
              echo "FLOW_REVIEW_DIR=$base_dir/.flow/bin"
              echo "FLOW_CONFIG=$base_dir/.flow/config.yml"
              # flow-0085: the task file is the STANDARD the PR is judged against, so it comes
              # from base too. A PR that edits its own acceptance criteria must not hand the
              # reviewers the edited copy.
