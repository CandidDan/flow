name: release-tag

# Moves the floating EDGE tag (v1-edge) to the tip of main on every push.
#
# Two aliases, deliberately:
#   v1-edge  — moved automatically, here. The canary channel. The busiest consuming repo pins this, so canonical
#              changes get exercised by real PR traffic within hours of merge, at no extra effort.
#   v1       — moved by a human, only after the canary has proven the release. The fleet pins
#              this. See docs/flow-versioning-policy.md.
#
# Why not move v1 here: this workflow originally did, which fixed the real problem that a manual
# retag gets forgotten (PR #5's triage fix sat on main for hours while repos ran broken infra,
# silently — consumers resolve @v1 happily, just to the old commit). But it also meant every
# merge reached every repo instantly, with nothing having run it once in anger. Splitting the
# alias keeps the fix and restores the canary.
#
# The major is derived from VERSION rather than hardcoded, so bumping VERSION to 2.0.0 starts
# publishing v2-edge and leaves v1-edge and v1 frozen at the last 1.x commit — what a repo
# pinned to @v1 should get from a major bump: nothing moves until it opts in.
#
# NOTHING MOVES UNTIL THE STAMP IS TRUE. `release-guard` runs first and fails the job when the
# tree about to be published carries a stamp that disagrees with itself or with the newest
# release tag. On 2026-08-19 v1.1.1 was cut onto a commit still stamped 1.1.0, flow-sync
# compared 1.1.0 against 1.1.0, called it `current`, and the fix reached nobody while every
# nightly run reported success. The guard is a tested module and this file only calls it —
# deliberately, because four earlier tasks ended up with criteria unprovable outside a workflow
# run, purely because their logic lived in inline shell. Keep the YAML to invocation.
#
# Alias rot (`v1` behind main) comes back as a WARNING with a number, never a failure: moving
# `v1` is the deliberate human step this file's canary split exists to preserve, and a release
# path that hard-fails on a deliberate manual step just teaches people to bypass it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # required to force-update the tag ref

# Never let two pushes race to move the same tag. Not cancel-in-progress: a cancelled run could
# leave the tag on an older commit than a run that already finished.
concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Invocation only — every decision (which tag is under scrutiny, what is a problem and
      # what is a warning) lives in .flow/bin/release-guard.mjs and is proved by its own tests.
      # Exits 1 on a stamp that lies, which stops the tag move below.
      - name: release-guard — the stamp must match the tree it stamps
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node .flow/bin/release-guard.mjs

      - name: Move the edge tag to this commit
        run: |
          set -euo pipefail

          if [ ! -f VERSION ]; then
            echo "::error::No VERSION file at the repo root — cannot derive the edge tag."
            exit 1
          fi

          VERSION="$(tr -d '[:space:]' < VERSION)"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::VERSION is '$VERSION', expected MAJOR.MINOR.PATCH."; exit 1 ;;
          esac

          EDGE="v${VERSION%%.*}-edge"
          STABLE="v${VERSION%%.*}"
          echo "VERSION=$VERSION -> moving $EDGE to $GITHUB_SHA"

          # Report what we're moving away from, so the run log is an audit trail of which
          # commit the canary was resolving to before this push.
          PREV="$(git rev-parse -q --verify "refs/tags/$EDGE" || true)"
          echo "previous $EDGE: ${PREV:-<none>}"

          if [ "$PREV" = "$GITHUB_SHA" ]; then
            echo "$EDGE already at $GITHUB_SHA — nothing to do."
            exit 0
          fi

          git tag -f "$EDGE" "$GITHUB_SHA"
          git push -f origin "refs/tags/$EDGE"

          STABLE_SHA="$(git rev-parse -q --verify "refs/tags/$STABLE" || true)"

          {
            echo "### \`$EDGE\` -> \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "The canary repo (pinned \`@$EDGE\`) now resolves to this commit."
            echo ""
            echo "\`$STABLE\` is unchanged at \`${STABLE_SHA:0:7}\` — the fleet has not moved."
            echo "Advance it deliberately once the canary is green:"
            echo ""
            echo '```'
            echo "git tag -f $STABLE <version> && git push -f origin $STABLE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
