name: _flow-gates (reusable)

# Reusable form of the Definition-of-Done gate. Repos call it from a 3-line caller
# (project-template/.github/workflows/flow-gates.yml) instead of copying this file —
# so the gate logic is authored once in canonical (CandidDan/flow) and adopted, never
# re-copied. See docs/flow-reusable-workflows.md.
#
# Enforces the gate on every PR, regardless of stack, by reading the command names from
# the *caller repo's* .flow/config.yml (checkout pulls the caller's repo, so .flow/ here is
# the consuming project's store and tooling). The protocol says "no PR without the gate";
# this makes that true even if an agent (or human) tries to skip it locally.

on:
  workflow_call:
    inputs:
      setup_node_version:
        description: >
          If set, runs actions/setup-node with this version before the per-stack gate
          commands. Defaults to 22 (the coverage flags require >= 22). Pass an empty string
          for a non-Node stack that provisions its own toolchain inside the config commands;
          a stack that needs a setup step we don't model should keep a full flow-gates.yml
          instead of the thin caller (copy-where-reference-won't-reach).
        required: false
        type: string
        default: "22"
      flow_ref:
        description: >
          Fallback ref in canonical to fetch this gate's helpers from, used ONLY where the
          `job.workflow_sha` context property is unavailable — i.e. GitHub Enterprise Server.
          On github.com leave it unset: the gate pins the exact commit this workflow file was
          resolved from, which cannot drift. Where you must set it, set it to the same ref your
          `uses:` pins, and read the race it reintroduces in
          docs/adr/0008-helpers-from-canonical.md. Never `main`: a moving branch is refused.
        required: false
        type: string
        default: ""

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # need the base commit to diff against

      # The store is main-only: feature branches carry code, never task-state. A branch
      # that also edited .flow/tasks/ would clobber main's newer state when it merges.
      # Reject it here so the rule isn't trust-based.
      #
      # flow-0008: the guard writes a decision line to $DECISION_LOG on every run, and the step
      # after it fails the job when that line is absent. Previously this step could no-op — a
      # bad `base`, an empty diff, a shell that died before the `if` — and exit 0, at which
      # point "the guard found nothing wrong" and "the guard never ran" were indistinguishable.
      # Branch names reach the script through `env:`, never through `${{ }}` interpolation.
      - name: Guard — store is main-only
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          DECISION_LOG: ${{ runner.temp }}/store-guard.log
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "origin/$BASE_BRANCH"...HEAD)"
          offenders="$(printf '%s\n' "$changed" | grep -E '^\.flow/tasks/' || true)"
          n="$(printf '%s' "$offenders" | grep -c . || true)"
          if [ "$n" -gt 0 ]; then reason=store-modified; else reason=clean; fi
          echo "store-guard: decision=enforced reason=$reason files=$n" | tee "$DECISION_LOG"
          if [ "$n" -gt 0 ]; then
            echo "::error::This PR modifies .flow/tasks/. Task state lives on main only —"
            echo "::error::feature branches carry code, not store changes. Move the state"
            echo "::error::transition to a commit on main and drop it from this branch."
            printf '%s\n' "$offenders" | sed 's/^/  offending: /'
            exit 1
          fi

      # flow-0008: absence of evidence is not evidence of absence. This step is the whole point
      # of the decision line — it is what makes a silent guard fail instead of pass.
      - name: Assert — the store-guard proved it ran
        if: github.event_name == 'pull_request'
        env:
          DECISION_LOG: ${{ runner.temp }}/store-guard.log
          DECISION_PREFIX: 'store-guard: decision='
        run: |
          # Anchored prefix match on a fixed token, never a loose substring: the guards' prose
          # is free to be reworded, the `<name>: decision=` prefix is a CI contract that is not.
          if [ ! -s "${DECISION_LOG:-}" ] || ! grep -qE "^${DECISION_PREFIX}" "$DECISION_LOG"; then
            echo "::error::No '${DECISION_PREFIX}...' line was produced — the guard did not run."
            echo "::error::Silence is not a pass: a guard that can be quiet and still be reported"
            echo "::error::as green is a guard-shaped hole. Failing the gate (flow-0008)."
            exit 1
          fi
          grep -E "^${DECISION_PREFIX}" "$DECISION_LOG"

      # Language toolchain. Node by default (the common Flow stack); non-Node callers pass
      # setup_node_version: "" and provision their toolchain inside the config commands.
      - name: Set up Node
        if: inputs.setup_node_version != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.setup_node_version }}

      - name: Read commands from .flow/config.yml
        id: cfg
        run: |
          # Braces matter: without them `a || b && c` runs the chmod even when snap succeeded
          # (live-validation finding, 2026-06-05).
          sudo snap install yq 2>/dev/null || { sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq; }
          {
            echo "install=$(yq -r '.commands.install' .flow/config.yml)"
            echo "build=$(yq -r '.commands.build' .flow/config.yml)"
            echo "lint=$(yq -r '.commands.lint' .flow/config.yml)"
            echo "test=$(yq -r '.commands.test' .flow/config.yml)"
            echo "coverage=$(yq -r '.commands.coverage' .flow/config.yml)"
            echo "covmin=$(yq -r '.coverage_min' .flow/config.yml)"
          } >> "$GITHUB_OUTPUT"

      # ── The CLAUDE.md ceiling (flow-0050) ──
      #
      # Straight after the config read, and BEFORE install/build: this needs nothing installed, and
      # a repo whose always-on instruction block has doubled should hear about it without waiting
      # for the slow half of the gate.
      #
      # It measures the RESOLVED IMPORT SET — CLAUDE.md plus every file Claude Code loads from it by
      # `@`-import — not `wc -c CLAUDE.md`. Those differ by design in every Flow repo: the template's
      # CLAUDE.md is 2.3k characters and imports the 24.6k-character .flow/PROTOCOL.md, so a
      # byte-counting check would be defeated on day one by canonical's own template, and moving
      # prose behind an import would read as an improvement.
      #
      # THE HOST FILE IS PASSED IN, not defaulted in the helper. `protocol-portability.test.mjs`
      # forbids a shipped bin helper from naming CLAUDE.md in executable code — the filename is
      # Claude Code's convention, and a helper that opened it by name would re-bind Flow to one
      # vendor. So this step is where the binding lives: one line, in the gate, in the open.
      #
      # The helper comes from canonical, not from this repo (flow-0094) — a repo that has never
      # run flow-sync still gets this check, which is the whole point. A repo with no
      # `claude_md_max` in its config is NOT an error: the helper warns and exits 0, so adopting
      # this does not turn the fleet red.
      # ── Canonical's own helpers, at THIS workflow's own commit (flow-0094, ADR-0008) ──
      #
      # Until now the gate ran the CALLER's `.flow/bin/` copy, which only changes when that repo's
      # flow-sync PR merges — while this file changes for every pinned repo the instant an alias
      # moves. Any release that made a reusable need a new helper therefore broke the whole fleet
      # until each repo synced. 2.1.0 (`source-roots.mjs`) and 2.1.1 (`check-claude-md.mjs`) did
      # exactly that on 28–29 Sep 2026. Fetching the helpers from canonical at the same commit as
      # this file makes the workflow and the helper it calls ship as one unit.
      #
      # This step is duplicated verbatim in every job that needs a helper; a reusable workflow
      # cannot share a step between jobs without a composite action, and a composite action would
      # itself have to be fetched before it could fetch anything. The copies must stay
      # byte-identical — `.flow/bin/canonical-helpers-workflow.test.mjs` pins that, exactly as
      # `gate-assertion.test.mjs` pins the two decision-line assertions below.
      - name: Materialise canonical's helpers at this workflow's commit
        env:
          # `job.workflow_sha` / `job.workflow_repository` describe THE FILE THAT DEFINES THIS JOB
          # — this reusable — where `github.workflow_sha` describes the caller's 3-line caller and
          # `github.job_workflow_sha` is not exposed as an expression at all. Both job properties
          # are absent on GitHub Enterprise Server; `flow_ref` is the fallback for that case only,
          # and its race is recorded in docs/adr/0008-helpers-from-canonical.md.
          FLOW_WORKFLOW_REPO: ${{ job.workflow_repository }}
          FLOW_WORKFLOW_SHA: ${{ job.workflow_sha }}
          FLOW_REF_INPUT: ${{ inputs.flow_ref }}
        run: |
          set -euo pipefail
          repo="${FLOW_WORKFLOW_REPO:-}"
          ref="${FLOW_WORKFLOW_SHA:-}"
          src="job.workflow_sha"
          if [ -z "$ref" ]; then
            src="flow_ref input"
            ref="${FLOW_REF_INPUT:-}"
          fi
          [ -n "$repo" ] || repo="CandidDan/flow"
          if [ -z "$ref" ]; then
            echo "::error::Cannot resolve the commit of this reusable workflow: job.workflow_sha is"
            echo "::error::empty (expected only on GitHub Enterprise Server) and no flow_ref input"
            echo "::error::was passed. Set flow_ref in your flow-gates.yml caller to the same ref"
            echo "::error::its uses: pins. See docs/adr/0008-helpers-from-canonical.md."
            exit 1
          fi
          case "$repo" in
            */*) ;;
            *) echo "::error::Refusing canonical repo '$repo' — expected owner/repo."; exit 1 ;;
          esac
          case "$ref" in
            main|master|HEAD|refs/heads/*)
              echo "::error::Refusing to fetch the gate's helpers from the moving ref '$ref'. A"
              echo "::error::gate that follows a branch cannot be reproduced from a run log. Pass"
              echo "::error::flow_ref as a tag or a commit sha."
              exit 1 ;;
            -*) echo "::error::Invalid ref '$ref' — a ref cannot begin with '-'."; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/flow-canonical"
          rm -rf "$dir"
          mkdir -p "$dir"
          git -C "$dir" init -q
          git -C "$dir" remote add origin "https://github.com/$repo.git"
          git -C "$dir" config core.sparseCheckout true
          printf 'project-template/.flow/bin/\n' > "$dir/.git/info/sparse-checkout"
          git -C "$dir" fetch -q --depth 1 origin "$ref"
          git -C "$dir" checkout -q FETCH_HEAD
          bin="$dir/project-template/.flow/bin"
          for helper in source-roots.mjs check-claude-md.mjs touches-guard.mjs; do
            if [ -f "$bin/$helper" ]; then continue; fi
            echo "::error::$repo@$ref carries no project-template/.flow/bin/$helper. That is"
            echo "::error::canonical's own tree at the commit this workflow was resolved from, so"
            echo "::error::it is a bug in canonical, not in this repository."
            exit 1
          done
          echo "flow-helpers: decision=materialised repo=$repo ref=$ref source=$src bin=$bin"
          echo "FLOW_BIN=$bin" >> "$GITHUB_ENV"

      - name: CLAUDE.md ceiling (claude_md_max)
        env:
          # The repo-root contract (ADR-0008). The helper now runs from canonical's checkout, where
          # its module-relative default would measure canonical's own fixture host file against the
          # uncalibrated REPLACE-ME config — and exit 0. FLOW_CI makes the absence of
          # FLOW_REPO_DIR an error instead of that silent fallback.
          FLOW_REPO_DIR: ${{ github.workspace }}
          FLOW_CI: "1"
        run: |
          set -euo pipefail
          node "$FLOW_BIN"/check-claude-md.mjs --entry CLAUDE.md

      - name: Install
        run: ${{ steps.cfg.outputs.install }}

      - name: Build
        run: ${{ steps.cfg.outputs.build }}

      - name: Lint
        run: ${{ steps.cfg.outputs.lint }}

      - name: Test
        run: ${{ steps.cfg.outputs.test }}

      - name: Coverage (fails under coverage_min)
        run: ${{ steps.cfg.outputs.coverage }}

      # Optional but recommended: a dependency audit. Wire to the stack's auditor.
      # - name: Dependency audit
      #   run: npm audit --audit-level=high   # or pip-audit, etc.

  # The flow tooling is JS regardless of the project's stack, so it's tested on its own —
  # the foundation's own Definition of Done ("every behaviour has a proving test") applies
  # to the tooling too. Stays independent of the per-stack gate above.
  flow-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test flow tooling
        run: node --test .flow/bin/*.test.mjs

      # Drift detection (back-ported from the canary repo's state:check): a validated store beats a
      # trusted one. Problems fail; warnings (e.g. stale board snapshot) just report.
      - name: flow-doctor — store consistency
        run: node .flow/bin/flow-doctor.mjs

  # Scope enforcement: a task-carrying PR's diff must stay within the task's declared `touches`.
  # Runs in the per-stack gate job (needs the PR diff + base). Mirrors the store-guard.
  touches:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # ── Canonical's own helpers, at THIS workflow's own commit (flow-0094, ADR-0008) ──
      #
      # Until now the gate ran the CALLER's `.flow/bin/` copy, which only changes when that repo's
      # flow-sync PR merges — while this file changes for every pinned repo the instant an alias
      # moves. Any release that made a reusable need a new helper therefore broke the whole fleet
      # until each repo synced. 2.1.0 (`source-roots.mjs`) and 2.1.1 (`check-claude-md.mjs`) did
      # exactly that on 28–29 Sep 2026. Fetching the helpers from canonical at the same commit as
      # this file makes the workflow and the helper it calls ship as one unit.
      #
      # This step is duplicated verbatim in every job that needs a helper; a reusable workflow
      # cannot share a step between jobs without a composite action, and a composite action would
      # itself have to be fetched before it could fetch anything. The copies must stay
      # byte-identical — `.flow/bin/canonical-helpers-workflow.test.mjs` pins that, exactly as
      # `gate-assertion.test.mjs` pins the two decision-line assertions below.
      - name: Materialise canonical's helpers at this workflow's commit
        env:
          # `job.workflow_sha` / `job.workflow_repository` describe THE FILE THAT DEFINES THIS JOB
          # — this reusable — where `github.workflow_sha` describes the caller's 3-line caller and
          # `github.job_workflow_sha` is not exposed as an expression at all. Both job properties
          # are absent on GitHub Enterprise Server; `flow_ref` is the fallback for that case only,
          # and its race is recorded in docs/adr/0008-helpers-from-canonical.md.
          FLOW_WORKFLOW_REPO: ${{ job.workflow_repository }}
          FLOW_WORKFLOW_SHA: ${{ job.workflow_sha }}
          FLOW_REF_INPUT: ${{ inputs.flow_ref }}
        run: |
          set -euo pipefail
          repo="${FLOW_WORKFLOW_REPO:-}"
          ref="${FLOW_WORKFLOW_SHA:-}"
          src="job.workflow_sha"
          if [ -z "$ref" ]; then
            src="flow_ref input"
            ref="${FLOW_REF_INPUT:-}"
          fi
          [ -n "$repo" ] || repo="CandidDan/flow"
          if [ -z "$ref" ]; then
