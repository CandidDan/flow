            */*) ;;
            *) echo "::error::Refusing canonical repo '$repo' — expected owner/repo."; exit 1 ;;
          esac
          case "$ref" in
            main|master|HEAD|refs/heads/*)
              echo "::error::Refusing to fetch the gate's helpers from the moving ref '$ref'. A"
              echo "::error::gate that follows a branch cannot be reproduced from a run log. Pass"
              echo "::error::flow_ref as a tag or a commit sha."
              exit 1 ;;
            -*) echo "::error::Invalid ref '$ref' — a ref cannot begin with '-'."; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/flow-canonical"
          rm -rf "$dir"
          mkdir -p "$dir"
          git -C "$dir" init -q
          git -C "$dir" remote add origin "https://github.com/$repo.git"
          git -C "$dir" config core.sparseCheckout true
          printf 'project-template/.flow/bin/\n' > "$dir/.git/info/sparse-checkout"
          git -C "$dir" fetch -q --depth 1 origin "$ref"
          git -C "$dir" checkout -q FETCH_HEAD
          bin="$dir/project-template/.flow/bin"
          for helper in source-roots.mjs check-claude-md.mjs touches-guard.mjs; do
            if [ -f "$bin/$helper" ]; then continue; fi
            echo "::error::$repo@$ref carries no project-template/.flow/bin/$helper. That is"
            echo "::error::canonical's own tree at the commit this workflow was resolved from, so"
            echo "::error::it is a bug in canonical, not in this repository."
            exit 1
          done
          echo "flow-helpers: decision=materialised repo=$repo ref=$ref source=$src bin=$bin"
          echo "FLOW_BIN=$bin" >> "$GITHUB_ENV"

      - name: touches-guard — diff stays within declared scope
        env:
          # The repo-root contract (ADR-0008). This guard is where the module-relative default is
          # most dangerous: run from canonical's checkout it would read canonical's own fixture
          # task store, find no task file, print `decision=skipped reason=no-task-file` and exit 0
          # — satisfying the assertion below while enforcing nothing.
          FLOW_REPO_DIR: ${{ github.workspace }}
          FLOW_CI: "1"
          HEAD_REF: ${{ github.head_ref }}
          # PR title is the id fallback when the platform forces a non-flow/ branch (CAN-52).
          # Without it this guard silently skipped every cloud-session PR.
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_REF: origin/${{ github.base_ref }}
          DECISION_LOG: ${{ runner.temp }}/touches-guard.log
        run: |
          # pipefail is NOT on by default in `bash -e {0}`. Without it `tee` would swallow the
          # guard's exit code and out-of-scope drift would pass the gate — the exact fail-open
          # shape flow-0008 exists to close, reintroduced by the capture that detects it.
          set -o pipefail
          git fetch -q origin "$BASE_BRANCH"
          node "$FLOW_BIN"/touches-guard.mjs 2>&1 | tee "$DECISION_LOG"

      # flow-0008: identical in body to the store-guard's assertion above — one rule, applied to
      # both guards. `.flow/bin/gate-assertion.test.mjs` pins that they stay byte-identical and
      # that this script fails against a guard that produced nothing.
      - name: Assert — the touches-guard proved it ran
        env:
          DECISION_LOG: ${{ runner.temp }}/touches-guard.log
          DECISION_PREFIX: 'touches-guard: decision='
        run: |
          # Anchored prefix match on a fixed token, never a loose substring: the guards' prose
          # is free to be reworded, the `<name>: decision=` prefix is a CI contract that is not.
          if [ ! -s "${DECISION_LOG:-}" ] || ! grep -qE "^${DECISION_PREFIX}" "$DECISION_LOG"; then
            echo "::error::No '${DECISION_PREFIX}...' line was produced — the guard did not run."
            echo "::error::Silence is not a pass: a guard that can be quiet and still be reported"
            echo "::error::as green is a guard-shaped hole. Failing the gate (flow-0008)."
            exit 1
          fi
          grep -E "^${DECISION_PREFIX}" "$DECISION_LOG"

  # ── The declared source_roots that the primary gate does NOT already cover (flow-0077) ──
  #
  # `source_roots:` in the caller's .flow/config.yml has always named every tree that holds source
  # and the command that parses it, but until flow-0077 nothing RAN those checks — flow-doctor only
  # proved each entry existed. A repo with a second runtime therefore dropped out of the thin-caller
  # model and hand-wrote a job per tree, which (a) duplicated this file, (b) could not be pushed by
  # a worker credential, since `.github/workflows/` needs Workflows: Write, and (c) was overwritten
  # by the next flow-sync. Now it is a .flow/config.yml edit, which any worker can push.
  #
  # TWO JOBS, not one: a matrix cannot be computed by the job that uses it. `plan` reads the config
  # and emits the entries that need their own job; `source-root` fans out over them.
  source-roots-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # ── Canonical's own helpers, at THIS workflow's own commit (flow-0094, ADR-0008) ──
      #
      # Until now the gate ran the CALLER's `.flow/bin/` copy, which only changes when that repo's
      # flow-sync PR merges — while this file changes for every pinned repo the instant an alias
      # moves. Any release that made a reusable need a new helper therefore broke the whole fleet
      # until each repo synced. 2.1.0 (`source-roots.mjs`) and 2.1.1 (`check-claude-md.mjs`) did
      # exactly that on 28–29 Sep 2026. Fetching the helpers from canonical at the same commit as
      # this file makes the workflow and the helper it calls ship as one unit.
      #
      # This step is duplicated verbatim in every job that needs a helper; a reusable workflow
      # cannot share a step between jobs without a composite action, and a composite action would
      # itself have to be fetched before it could fetch anything. The copies must stay
      # byte-identical — `.flow/bin/canonical-helpers-workflow.test.mjs` pins that, exactly as
      # `gate-assertion.test.mjs` pins the two decision-line assertions below.
      - name: Materialise canonical's helpers at this workflow's commit
        env:
          # `job.workflow_sha` / `job.workflow_repository` describe THE FILE THAT DEFINES THIS JOB
          # — this reusable — where `github.workflow_sha` describes the caller's 3-line caller and
          # `github.job_workflow_sha` is not exposed as an expression at all. Both job properties
          # are absent on GitHub Enterprise Server; `flow_ref` is the fallback for that case only,
          # and its race is recorded in docs/adr/0008-helpers-from-canonical.md.
          FLOW_WORKFLOW_REPO: ${{ job.workflow_repository }}
          FLOW_WORKFLOW_SHA: ${{ job.workflow_sha }}
          FLOW_REF_INPUT: ${{ inputs.flow_ref }}
        run: |
          set -euo pipefail
          repo="${FLOW_WORKFLOW_REPO:-}"
          ref="${FLOW_WORKFLOW_SHA:-}"
          src="job.workflow_sha"
          if [ -z "$ref" ]; then
            src="flow_ref input"
            ref="${FLOW_REF_INPUT:-}"
          fi
          [ -n "$repo" ] || repo="CandidDan/flow"
          if [ -z "$ref" ]; then
            echo "::error::Cannot resolve the commit of this reusable workflow: job.workflow_sha is"
            echo "::error::empty (expected only on GitHub Enterprise Server) and no flow_ref input"
            echo "::error::was passed. Set flow_ref in your flow-gates.yml caller to the same ref"
            echo "::error::its uses: pins. See docs/adr/0008-helpers-from-canonical.md."
            exit 1
          fi
          case "$repo" in
            */*) ;;
            *) echo "::error::Refusing canonical repo '$repo' — expected owner/repo."; exit 1 ;;
          esac
          case "$ref" in
            main|master|HEAD|refs/heads/*)
              echo "::error::Refusing to fetch the gate's helpers from the moving ref '$ref'. A"
              echo "::error::gate that follows a branch cannot be reproduced from a run log. Pass"
              echo "::error::flow_ref as a tag or a commit sha."
              exit 1 ;;
            -*) echo "::error::Invalid ref '$ref' — a ref cannot begin with '-'."; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/flow-canonical"
          rm -rf "$dir"
          mkdir -p "$dir"
          git -C "$dir" init -q
          git -C "$dir" remote add origin "https://github.com/$repo.git"
          git -C "$dir" config core.sparseCheckout true
          printf 'project-template/.flow/bin/\n' > "$dir/.git/info/sparse-checkout"
          git -C "$dir" fetch -q --depth 1 origin "$ref"
          git -C "$dir" checkout -q FETCH_HEAD
          bin="$dir/project-template/.flow/bin"
          for helper in source-roots.mjs check-claude-md.mjs touches-guard.mjs; do
            if [ -f "$bin/$helper" ]; then continue; fi
            echo "::error::$repo@$ref carries no project-template/.flow/bin/$helper. That is"
            echo "::error::canonical's own tree at the commit this workflow was resolved from, so"
            echo "::error::it is a bug in canonical, not in this repository."
            exit 1
          done
          echo "flow-helpers: decision=materialised repo=$repo ref=$ref source=$src bin=$bin"
          echo "FLOW_BIN=$bin" >> "$GITHUB_ENV"

      # "A caller that bumped its workflow refs without syncing `.flow/bin/`" used to be the
      # failure this step guarded against by name. It can no longer happen: the helper arrives
      # with the workflow (flow-0094), so there is nothing left to be missing and nothing to tell
      # the caller to run.
      - name: Plan — which declared source_roots need a job of their own
        id: plan
        env:
          FLOW_REPO_DIR: ${{ github.workspace }}
          FLOW_CI: "1"
        run: |
          set -euo pipefail
          node "$FLOW_BIN"/source-roots.mjs plan

  # `if` on the count, so a repo with nothing extra to gate gets a SKIPPED job rather than a red
  # one — an empty matrix is the correct answer for a single-tree repo, and for canonical itself
  # (all four of its entries are `npm run lint`/`npm run build`, which the gate job above runs).
  # fail-fast is off: one broken tree must not cancel the others' verdicts.
  #
  # The name is STATIC on purpose (flow-0087). GitHub never evaluates a skipped job's name, so a
  # `${{ matrix.path }}` in it showed up verbatim on every PR where this job skips — the common
  # case — and read as broken templating. A static name still gets the matrix values appended
  # in parentheses when the job runs.
  source-root:
    needs: source-roots-plan
    if: needs.source-roots-plan.outputs.count != '0'
    name: source-root
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source-roots-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Runtime setup, chosen by the entry's `runtime`. `none` gets neither step — the check
      # provisions its own toolchain, which is how a stack Flow does not model still gets gated.
      - name: Set up Node
        if: matrix.runtime == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.version }}
          cache: ${{ matrix.cache }}
          cache-dependency-path: ${{ matrix.cache_dependency_path }}

      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.version }}

      # `path` and `check` come from .flow/config.yml, which a PR can edit. Running a
      # config-supplied command is not new — the gate job above already runs `commands.*`. What
      # would be new is `${{ matrix.check }}` inside this `run:`, where Actions pastes the value
      # into the script BEFORE bash sees it, so a crafted check could break out of the quoting and
      # run something the config never said. Through `env:` the value is data to the shell, and
      # the helper hands it to one `spawnSync` with the shell it is supposed to have.
      # ── Canonical's own helpers, at THIS workflow's own commit (flow-0094, ADR-0008) ──
      #
      # Until now the gate ran the CALLER's `.flow/bin/` copy, which only changes when that repo's
      # flow-sync PR merges — while this file changes for every pinned repo the instant an alias
      # moves. Any release that made a reusable need a new helper therefore broke the whole fleet
      # until each repo synced. 2.1.0 (`source-roots.mjs`) and 2.1.1 (`check-claude-md.mjs`) did
      # exactly that on 28–29 Sep 2026. Fetching the helpers from canonical at the same commit as
      # this file makes the workflow and the helper it calls ship as one unit.
      #
      # This step is duplicated verbatim in every job that needs a helper; a reusable workflow
      # cannot share a step between jobs without a composite action, and a composite action would
      # itself have to be fetched before it could fetch anything. The copies must stay
      # byte-identical — `.flow/bin/canonical-helpers-workflow.test.mjs` pins that, exactly as
      # `gate-assertion.test.mjs` pins the two decision-line assertions below.
      - name: Materialise canonical's helpers at this workflow's commit
        env:
          # `job.workflow_sha` / `job.workflow_repository` describe THE FILE THAT DEFINES THIS JOB
          # — this reusable — where `github.workflow_sha` describes the caller's 3-line caller and
          # `github.job_workflow_sha` is not exposed as an expression at all. Both job properties
          # are absent on GitHub Enterprise Server; `flow_ref` is the fallback for that case only,
          # and its race is recorded in docs/adr/0008-helpers-from-canonical.md.
          FLOW_WORKFLOW_REPO: ${{ job.workflow_repository }}
          FLOW_WORKFLOW_SHA: ${{ job.workflow_sha }}
          FLOW_REF_INPUT: ${{ inputs.flow_ref }}
        run: |
          set -euo pipefail
          repo="${FLOW_WORKFLOW_REPO:-}"
          ref="${FLOW_WORKFLOW_SHA:-}"
          src="job.workflow_sha"
          if [ -z "$ref" ]; then
            src="flow_ref input"
            ref="${FLOW_REF_INPUT:-}"
          fi
          [ -n "$repo" ] || repo="CandidDan/flow"
          if [ -z "$ref" ]; then
            echo "::error::Cannot resolve the commit of this reusable workflow: job.workflow_sha is"
            echo "::error::empty (expected only on GitHub Enterprise Server) and no flow_ref input"
            echo "::error::was passed. Set flow_ref in your flow-gates.yml caller to the same ref"
            echo "::error::its uses: pins. See docs/adr/0008-helpers-from-canonical.md."
            exit 1
          fi
          case "$repo" in
            */*) ;;
            *) echo "::error::Refusing canonical repo '$repo' — expected owner/repo."; exit 1 ;;
          esac
          case "$ref" in
            main|master|HEAD|refs/heads/*)
              echo "::error::Refusing to fetch the gate's helpers from the moving ref '$ref'. A"
              echo "::error::gate that follows a branch cannot be reproduced from a run log. Pass"
              echo "::error::flow_ref as a tag or a commit sha."
              exit 1 ;;
            -*) echo "::error::Invalid ref '$ref' — a ref cannot begin with '-'."; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/flow-canonical"
          rm -rf "$dir"
          mkdir -p "$dir"
          git -C "$dir" init -q
          git -C "$dir" remote add origin "https://github.com/$repo.git"
          git -C "$dir" config core.sparseCheckout true
          printf 'project-template/.flow/bin/\n' > "$dir/.git/info/sparse-checkout"
          git -C "$dir" fetch -q --depth 1 origin "$ref"
          git -C "$dir" checkout -q FETCH_HEAD
          bin="$dir/project-template/.flow/bin"
          for helper in source-roots.mjs check-claude-md.mjs touches-guard.mjs; do
            if [ -f "$bin/$helper" ]; then continue; fi
            echo "::error::$repo@$ref carries no project-template/.flow/bin/$helper. That is"
            echo "::error::canonical's own tree at the commit this workflow was resolved from, so"
            echo "::error::it is a bug in canonical, not in this repository."
            exit 1
          done
          echo "flow-helpers: decision=materialised repo=$repo ref=$ref source=$src bin=$bin"
          echo "FLOW_BIN=$bin" >> "$GITHUB_ENV"

      # flow-0097: install the repo's OWN dependencies before the check, for `runtime: node` only.
      #
      # `setup-node` puts a node on the PATH and nothing else, so before this step a check as
      # ordinary as `npm run lint` exited 127 in any repo whose linter is a devDependency — the
      # repo had already declared `commands.install` and this job ignored it. Repos worked around
      # it by folding an install into every `check`, which is the config duplicating what the
      # config already says.
      #
      # `matrix.install` is "" for `runtime: deno`, for `runtime: none` (whose contract is that
      # the check provisions itself), and for a repo whose `commands.install` is absent or still
      # REPLACE-ME — so the `if` below skips the step and the check still runs. The command is
      # the repo's own config, and it reaches the shell through `env:` like every other matrix
      # value; `${{ }}` in a `run:` block is substituted before bash parses it, so a crafted
      # value would escape the quoting. `bash -c "$VAR"` hands it over as DATA instead — the same
      # trust posture the `gate` job already has when it runs `commands.*`.
      #
      # No helper, and no FLOW_REPO_DIR: a `run:` step's working directory is already
      # `github.workspace`, the caller's checkout, which is the repo root this must install into.
      # The declared check needs the helper because the helper is what keeps `matrix.check` out
      # of the `run:` line and owns the retry loop; an install has neither concern.
      - name: Install the repo's dependencies
        if: matrix.runtime == 'node' && matrix.install != ''
        env:
          # Deliberately not FLOW_SOURCE_ROOT_RETRY's sibling: `retry` is declared per
          # source_root for a flaky CHECK, and silently applying it to the install would change
          # what that number means without the config saying so.
          FLOW_SOURCE_ROOT_INSTALL: ${{ matrix.install }}
        run: |
          set -euo pipefail
          echo "source-roots: installing before the check — $FLOW_SOURCE_ROOT_INSTALL"
          bash -c "$FLOW_SOURCE_ROOT_INSTALL"

      - name: Run the declared check
        env:
          FLOW_SOURCE_ROOT_PATH: ${{ matrix.path }}
          FLOW_SOURCE_ROOT_CHECK: ${{ matrix.check }}
          FLOW_SOURCE_ROOT_RETRY: ${{ matrix.retry }}
          # The repo-root contract (ADR-0008). The helper `chdir`s here before spawning the
          # declared check, so a tree's check still runs in the repo that declared it.
          FLOW_REPO_DIR: ${{ github.workspace }}
          FLOW_CI: "1"
        run: node "$FLOW_BIN"/source-roots.mjs run
