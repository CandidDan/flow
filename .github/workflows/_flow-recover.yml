name: _flow-recover (reusable)

# Reusable form of the stranded-task self-heal sweep (CAN-51). Repos call it from a thin caller
# that owns the `schedule` + `workflow_dispatch` (forwarding `threshold_minutes` via `with:`);
# the logic is authored once in canonical. See docs/flow-reusable-workflows.md.
#
# CAN-51: self-heal tasks stranded `in_progress` with no PR. CAN-50 (flow-open-pr) makes a
# worker stopping short of `gh pr create` less likely, but prevention can never be total — a
# process can die at any point between push and PR (crash, timeout, network). Today that leaves
# the task in_progress with no PR forever, until a human notices: the single point of manual
# rescue the loop is meant to remove. A stranded task is a precisely detectable state, so this
# sweep heals it: re-open the PR when work was pushed, or reset the claim to `ready` when there
# is nothing to recover.
#
# Conservative by construction: only acts past a staleness threshold, never disturbs a task
# with an open PR, and resets ONLY via apply-board-edits.mjs (a commit to main — never a
# hand-edit). DORMANT until FLOW_AI=true (same switch as the queue-runner — no autonomous
# workers, nothing to strand); always runnable on demand via the caller's workflow_dispatch.
#
# Reopened PRs use FLOW_PAT (CAN-58) so flow-gates fires on them too; falls back to GITHUB_TOKEN
# when the secret is unset (recovery still works, just ungated). The thin caller passes the
# secret by name, not `secrets: inherit`. See _flow-open-pr.yml for FLOW_PAT setup.

on:
  workflow_call:
    inputs:
      threshold_minutes:
        description: "Minutes of no movement before a task is considered stranded (default 75)."
        required: false
        type: string
    secrets:
      FLOW_PAT:
        required: false

permissions:
  contents: write          # reset commit to main
  pull-requests: write     # reopen-pr path

jobs:
  sweep:
    if: ${{ vars.FLOW_AI == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Sweep stranded in_progress tasks
        env:
          # Only `gh` calls use this; the reset-to-ready `git push` uses the checkout credential.
          GH_TOKEN: ${{ secrets.FLOW_PAT || github.token }}
          THRESHOLD: ${{ inputs.threshold_minutes || '75' }}
        run: |
          # Bootstrap guard: the helper lives in the consuming repo once it adopts the template.
          if [ ! -f .flow/bin/flow-recover.mjs ]; then
            echo "No .flow/bin/flow-recover.mjs in this repo yet — nothing to do."
            exit 0
          fi
          git config user.name  "flow-bot"
          git config user.email "flow-bot@users.noreply.github.com"
          now="$(date +%s)"

          # Bound the dispatch-supplied threshold: non-numeric -> default, cap at 24h so a
          # stray large value can't silently disable the sweep for a whole run.
          case "$THRESHOLD" in ""|*[!0-9]*) THRESHOLD=75 ;; esac
          [ "$THRESHOLD" -gt 1440 ] && THRESHOLD=1440

          # Each line is "<id>\t<started>\t<branch>" for an in_progress task. The third field is
          # the branch the store recorded at claim time; it is empty until flow-status writes it.
          node .flow/bin/flow-recover.mjs list-in-progress | while IFS="$(printf '\t')" read -r id started declared_branch; do
            [ -z "$id" ] && continue
            # Validate the id shape before it ever reaches a shell command (git ls-remote, gh).
            # Task files on main are trusted (only Dan / flow-bot write them, and flow-gates
            # blocks PR-injected task changes), but this closes any $()-injection gap entirely.
            if ! printf '%s' "$id" | grep -qE '^[A-Za-z][A-Za-z0-9]*-[0-9]{1,4}$'; then
              echo "Skipping malformed task id '$id'."; continue
            fi
            echo "::group::$id"

            # Discover the worker branch. The store's own `branch` field comes FIRST and the
            # `flow/<id>-…` convention second — see recoveryBranchCandidates() in flow-recover.mjs
            # for why the convention alone was never enough (cloud sessions are handed a
            # `claude/…` branch they are told not to rename, and the protocol makes the PR title,
            # not the branch, the load-bearing identifier). The candidate list and its ordering
            # are decided in the helper; this shell only tries them in turn.
            # Via a file, not a heredoc or a pipe, and both alternatives are traps rather than
            # style: a heredoc terminator must sit at column 0, which ends this YAML block scalar
            # early and makes the workflow unparseable; a `... | while` runs the loop in a subshell,
            # so the $branch it finds is discarded when the loop exits.
            cand_file="${RUNNER_TEMP:-/tmp}/flow-recover-candidates"
            node .flow/bin/flow-recover.mjs branch-candidates "$id" "$declared_branch" > "$cand_file"
            branch=""
            while IFS= read -r pattern; do
              [ -z "$pattern" ] && continue
              match="$(git ls-remote --heads origin "$pattern" </dev/null | head -1 | sed 's#.*refs/heads/##')"
              if [ -n "$match" ]; then branch="$match"; break; fi
            done < "$cand_file"

            # "Is this task progressing?" is asked in TWO branch-independent ways, and either
            # answer protects the claim. The head match is exact when a branch was found; the
            # title match (`[<id>] …`) works even when it was not, which is the case that used to
            # end with a live PR's task being reset to `ready`. --limit 200 because gh defaults to
            # 30 and a quiet repo can still carry more open PRs than that.
            prs_json="$(gh pr list --state open --limit 200 --json title </dev/null 2>/dev/null || echo '[]')"
            by_title="$(printf '%s' "$prs_json" | node .flow/bin/flow-recover.mjs count-task-prs "$id")"
            if [ -n "$branch" ]; then
              by_head="$(gh pr list --head "$branch" --state open --json number --jq 'length' </dev/null 2>/dev/null || echo 0)"
            else
              by_head=0
            fi
            has_open_pr=0
            [ "${by_title:-0}" -gt 0 ] && has_open_pr=1
            [ "${by_head:-0}" -gt 0 ] && has_open_pr=1

            if [ -n "$branch" ]; then
              branch_exists=1
              # fetch-depth: 0 on the main checkout fetched every origin ref, so the
              # remote-tracking origin/$branch is usually present for rev-list without an extra
              # fetch. A branch pushed since the checkout is not — count 0 rather than failing the
              # sweep, which reads as "nothing to recover yet" and is retried next run.
              ahead="$(git rev-list --count "origin/main..origin/$branch" 2>/dev/null || echo 0)"
              tip_epoch="$(git log -1 --format=%ct "origin/$branch" 2>/dev/null || echo "$now")"
              age=$(( (now - tip_epoch) / 60 ))
            else
              branch_exists=0; ahead=0
              # No branch: age from `started`. A date-only value must be read as the END of that
              # day, not its midnight. `date -d 2026-08-14` resolves to 00:00Z, so a task claimed
              # at 09:23Z measured "563 minutes old" the moment it was claimed — past the 75m
              # threshold before the worker had cut a branch. The sweep then reset the live claim
              # to `ready` within a minute of every claim, the next queue-runner re-picked the
              # same task from zero, and no run's work ever carried forward (observed: three
              # consecutive error_max_turns runs on one task, ~$13 each, no PR). Anchoring to
              # 23:59:59Z errs the only safe way for a destructive sweep: it can delay a genuine
              # recovery, never cancel a live one. New claims write a full ISO datetime (see
              # CLAUDE.md) and take the exact path; this branch covers legacy date-only values.
              start_at="$started"
              case "$start_at" in
                [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) start_at="$start_at 23:59:59" ;;
              esac
              if [ -n "$start_at" ] && start_epoch="$(date -u -d "$start_at" +%s 2>/dev/null)"; then
                age=$(( (now - start_epoch) / 60 ))
                [ "$age" -lt 0 ] && age=0
              else
                age=0
              fi
            fi

            decision="$(node .flow/bin/flow-recover.mjs classify \
              --status in_progress --branch-exists "$branch_exists" --ahead "$ahead" \
              --has-open-pr "$has_open_pr" --age "$age" --threshold "$THRESHOLD")"
            echo "$id: branch='${branch:-<none>}' (declared='${declared_branch:-<none>}') ahead=$ahead open_pr=$has_open_pr (title=$by_title head=$by_head) age=${age}m -> $decision"

            case "$decision" in
              reopen-pr)
                # Reuse the CAN-50 decision + gh pr create for the existing branch.
                # --id: recovery starts from the task file, so it knows the id even when the
                # branch is a platform-assigned `claude/…` that flow-open-pr cannot parse. Without
                # it this call returns nothing and the recovery silently opens no PR.
                d="$(node .flow/bin/flow-open-pr.mjs --branch "$branch" --base main --ahead "$ahead" --has-open-pr "$has_open_pr" --id "$id")"
                if [ -n "$d" ]; then
                  title="$(node -e 'console.log(JSON.parse(process.argv[1]).title)' "$d")"
                  task_path="$(grep -rl "^id: \"$id\"" .flow/tasks/ | head -1)"
                  body="$(printf '%s\n\nTask: `%s`\n\n%s\n' \
                    "Recovered by **flow-recover** (CAN-51): \`$branch\` was pushed but no PR existed." \
                    "${task_path:-.flow/tasks/ (id $id)}" \
                    "Opened as a **draft** — this branch was stranded, so the work is unfinished by definition. Run \`gh pr ready\` once it is complete.")"
                  # --draft for the same reason as flow-open-pr (flow-0039), and more so: a recovered
                  # branch is stranded work by definition, and marking it ready would flip the task to
                  # in_review and spend the three review agents on an abandoned build. Same fallback —
                  # a repo without draft support gets a non-draft PR rather than no PR.
                  if ! gh pr create --draft --base main --head "$branch" --title "$title" --body "$body"; then
                    echo "::warning::Could not open a draft PR for $id (drafts need a paid plan on a private repo) — retrying without --draft."
                    gh pr create --base main --head "$branch" --title "$title" --body "$body" || \
                      echo "gh pr create failed for $id — will retry next sweep."
                  fi
                fi
                ;;
              reset-to-ready)
                node .flow/bin/flow-recover.mjs reset "$id" > .flow/board-edits.json
                node .flow/bin/apply-board-edits.mjs
                if git diff --quiet -- .flow/tasks/; then
                  echo "No change for $id (already reset / not found)."
                else
                  git add .flow/tasks/
                  git commit -m "flow: recover $id -> ready (stranded ${age}m, no branch/PR)"
                  # Rebase before pushing: a second reset in the same sweep would otherwise be
                  # rejected because the first push moved main.
                  git pull --rebase origin main
                  git push origin main
                fi
                ;;
              *)
                echo "$id healthy — leaving it alone."
                ;;
            esac
            echo "::endgroup::"
          done
