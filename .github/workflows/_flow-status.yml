name: _flow-status (reusable)

# Reusable form of the PR-event status sync. Repos call it from a thin caller; the logic
# is authored once in canonical. See docs/flow-reusable-workflows.md.
#
# Event-driven state: the worker writes code and opens/closes PRs; PR events own the
# lifecycle transitions so frontmatter never needs hand-editing for them.
#   opened / reopened, DRAFT   -> stays in_progress (+ branch & pr recorded) — flow-0039
#   opened / reopened, ready   -> in_review (+ branch & pr recorded)
#   ready_for_review           -> in_review (the hand-off; a worker's `gh pr ready`)
#   closed without merge       -> back to ready (owner/branch/pr cleared for re-claim)
#   closed by merge            -> handled by flow-done.yml (this job no-ops)
#   anything else              -> logged no-op (a caller pinned ahead of this reusable)
# Workers write only two transitions by hand: the claim (ready -> in_progress, which must
# stay an atomic first-push-wins commit) and blocked (a judgment call).

on:
  workflow_call:

permissions:
  contents: write

jobs:
  sync-status:
    # No branch-name gate: a cloud session forced onto a non-flow/ branch (e.g. claude/…) must
    # still transition. The id is resolved from the branch OR the PR title (CAN-52); the step
    # no-ops cleanly when neither carries one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Sync task state from the PR event
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ACTION:   ${{ github.event.action }}
          MERGED:   ${{ github.event.pull_request.merged }}
          PR_URL:   ${{ github.event.pull_request.html_url }}
          PR_NUM:   ${{ github.event.pull_request.number }}
          # flow-0039. Present on every `pull_request` event, so draft state needs no API call.
          DRAFT:    ${{ github.event.pull_request.draft }}
        run: |
          # Branch name first (canonical), PR title second (CAN-52 fallback for non-flow/ branches).
          # The job checks out `main`; the helper lives there once the repo adopts the template.
          # Guard its presence (so a bootstrap PR no-ops cleanly) and keep the call non-fatal under
          # set -e: any miss yields an empty id and the safe no-op below.
          id=""
          if [ -f .flow/bin/parse-task-id.mjs ]; then
            id="$(node .flow/bin/parse-task-id.mjs "$HEAD_REF" "$PR_TITLE" || true)"
          fi
          if [ -z "$id" ]; then echo "No task id in branch '$HEAD_REF' or title '$PR_TITLE' — nothing to sync."; exit 0; fi

          # flow-0039: a DRAFT PR is not a hand-off. flow-open-pr fires on the first push, so a PR
          # existing says only "a branch was pushed" — it is `ready_for_review` that says the worker
          # is done. A draft therefore records `branch` + `pr` (genuinely new information, and
          # earlier than the store used to get it) while leaving the task `in_progress`; the
          # in_review transition moves to the moment the draft is marked ready.
          case "$ACTION" in
            opened|reopened)
              if [ "$DRAFT" = "true" ]; then
                echo "PR #$PR_NUM opened as a draft -> $id stays in_progress (branch + pr recorded)"
                TRANSITION="in_progress (branch + pr recorded)"
                printf '{"updates":[{"id":"%s","status":"in_progress","branch":"%s","pr":"%s"}]}\n' \
                  "$id" "$HEAD_REF" "$PR_URL" > .flow/board-edits.json
              else
                echo "PR #$PR_NUM opened ready for review -> $id in_review"
                TRANSITION="in_review"
                printf '{"updates":[{"id":"%s","status":"in_review","branch":"%s","pr":"%s"}]}\n' \
                  "$id" "$HEAD_REF" "$PR_URL" > .flow/board-edits.json
              fi
              ;;
            ready_for_review)
              echo "PR #$PR_NUM marked ready for review -> $id in_review"
              TRANSITION="in_review"
              printf '{"updates":[{"id":"%s","status":"in_review","branch":"%s","pr":"%s"}]}\n' \
                "$id" "$HEAD_REF" "$PR_URL" > .flow/board-edits.json
              ;;
            closed)
              if [ "$MERGED" = "true" ]; then echo "Merged — flow-done owns this transition."; exit 0; fi
              echo "PR #$PR_NUM closed unmerged -> $id back to ready"
              TRANSITION="ready"
              printf '{"updates":[{"id":"%s","status":"ready","owner":"","branch":"","pr":""}]}\n' \
                "$id" > .flow/board-edits.json
              ;;
            *)
              # An action this reusable does not model. Reachable whenever a caller is pinned to a
              # ref that lists a `types:` entry the reusable predates — exactly the `@v1` vs `@main`
              # skew flow-0033 hit — and without this branch the run would fall through to
              # apply-board-edits.mjs with no edits file written. Degrade to silence, not a crash.
              echo "PR #$PR_NUM: action '$ACTION' is not one this workflow transitions on — nothing to do."
              exit 0
              ;;
          esac

          # `apply-board-edits.mjs` CONSUMES the edits file, and the retry below re-derives this
          # edit against a fresh tip on every attempt — so keep the payload and the message.
          EDITS="$(cat .flow/board-edits.json)"
          COMMIT_MSG="flow: $id status sync ($ACTION, PR #$PR_NUM)"

          node .flow/bin/apply-board-edits.mjs

          if git diff --quiet -- .flow/tasks/; then
            echo "No state change for $id (no matching task file?) — nothing to commit."
            exit 0
          fi

          # >>> flow-0059 state-push-retry — byte-identical in _flow-status.yml and _flow-done.yml >>>
          # `main` is written constantly: the queue-runner claiming, this workflow on a PR event,
          # flow-done on merge, flow-recover sweeping, and humans. A single `git push origin main`
          # therefore loses whenever anything else lands between this job's checkout and its push —
          # the transition is computed correctly, committed on the runner, refused with
          # `! [rejected] main -> main (fetch first)`, and then destroyed with the container. That is
          # not bad luck; concurrent writes are the normal case. Observed on run 35058472116, which
          # dropped flow-0056's `in_review` and needed a human to replay it.
          #
          # The shape is allocate-task-id.mjs's, for the identical race: DISCARD the attempt and REDO
          # it against the new tip. Deliberately absent: `pull`, `rebase`, `merge`, `--force` — each
          # of those COMBINES a stale edit with someone else's rather than re-deriving it, and a
          # rebase-then-push still loses inside the window between the rebase and the push.
          # Exhausting the attempts exits NON-ZERO naming the task and the transition: a state change
          # that vanishes quietly is the entire defect, so swallowing the last failure would rebuild
          # the bug with more code in front of it.
          MAX_PUSH_ATTEMPTS=5

          # The task file this run edits. Read off the diff rather than guessed from `$id`, so it is
          # exactly the file about to be committed.
          task_file="$(git diff --name-only -- .flow/tasks/ | head -1)"

          # flow-0114: the refusal below is per-FIELD, not per-blob. `apply-board-edits.mjs` patches
          # named frontmatter fields only, so an edit by another actor to a field this run does NOT
          # write — a worker's `notes:` entry, a widened `touches`, a body edit — cannot be lost by
          # re-applying: the retry re-derives from the new tip, which already carries it. Comparing
          # whole blobs called every one of those a conflict, and the commonest of them is on the
          # normal path of almost every task: a worker's last act is a handoff note on its own task
          # file on `main`, and marking the draft ready fires flow-status on the same file seconds
          # later. Observed on CandidDan/tanplan-platform#25 — the note and the status write touched
          # different fields and composed cleanly, and the transition was dropped anyway.
          #
          # So guard exactly the fields these edits write, and nothing else. `$EDITS` is the payload,
          # so the list is derived from it rather than restated per call site.
          written_fields="$(printf '%s\n' "$EDITS" | node -e '
            let s = ""; process.stdin.on("data", (d) => { s += d; }).on("end", () => {
              const keys = new Set();
              for (const u of JSON.parse(s).updates || []) {
                for (const k of Object.keys(u)) if (k !== "id") keys.add(k);
              }
              process.stdout.write([...keys].join(" ") + "\n");
            });')"

          # Read those fields out of a task file on stdin: one `<field>=<value>` line each, in a
          # fixed order, so two readings compare as plain text. Frontmatter only — a `status:` inside
          # the body is prose, not state. A field with no line reads `<absent>`, which is a value
          # worth comparing in its own right because apply-board-edits appends a missing field.
          FIELD_READER='
            const fields = process.argv[1].split(" ").filter(Boolean);
            let s = ""; process.stdin.on("data", (d) => { s += d; }).on("end", () => {
              const end = s.indexOf("\n---", 3);
              const head = end === -1 ? s : s.slice(0, end);
              for (const f of fields) {
                const m = head.match(new RegExp("^" + f + ":[ \\t]*(.*)$", "m"));
                process.stdout.write(f + "=" + (m ? m[1].trim() : "<absent>") + "\n");
              }
            });'
          base_fields="$(git show "HEAD:$task_file" | node -e "$FIELD_READER" "$written_fields")"
          echo "Guarding [$written_fields] of $task_file against concurrent edits; everything else in that file composes."

          git config user.name  "flow-bot"
          git config user.email "flow-bot@users.noreply.github.com"
          git add .flow/tasks/
          git commit -m "$COMMIT_MSG"

          attempt=1
          until git push origin HEAD:main; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$MAX_PUSH_ATTEMPTS" ]; then
              echo "::error::flow: LOST STATE CHANGE — $id -> $TRANSITION could not be pushed to main after $MAX_PUSH_ATTEMPTS attempts. $task_file on main is STALE and no other workflow will re-fire this transition. Re-run this workflow, or apply it by hand."
              exit 1
            fi

            # Throw our commit away and re-read `main`. A reset, not a pull: there is no local work
            # worth preserving, and the next attempt re-derives the edit from scratch.
            sleep "$attempt"
            git fetch origin main --quiet
            git reset --hard FETCH_HEAD

            # The guarded fields as the NEW tip has them. Read BEFORE re-applying, so this is the
            # other actor's state and not the one we are about to write over it.
            now_fields="$(git show "HEAD:$task_file" | node -e "$FIELD_READER" "$written_fields")"

            printf '%s\n' "$EDITS" > .flow/board-edits.json
            node .flow/bin/apply-board-edits.mjs

            if git diff --quiet -- .flow/tasks/; then
              echo "$id is already at '$TRANSITION' on main — someone else landed it. Nothing left to push."
              exit 0
            fi

            # Re-applying still changes the file, so the tip is not yet what this run wants. Whether
            # that is a CONFLICT depends on which field moved. A guarded field still reading as it did
            # at our starting tip is ours to write — the other actor changed something else, and that
            # something else is already in the tree we just re-applied onto, so it survives. A guarded
            # field another actor set to the value we would write is already landed. Anything else is
            # theirs, and pushing would erase it, which is worse than the drop this loop prevents.
            # Name the field and both values: the alternative is a human diffing two commits to find
            # out what collided.
            want_fields="$(node -e "$FIELD_READER" "$written_fields" < "$task_file")"
            conflicts="$(FLOW_BASE="$base_fields" FLOW_NOW="$now_fields" FLOW_WANT="$want_fields" node -e '
              const readFields = (v) => new Map((v || "").split("\n").filter(Boolean).map((l) => {
                const i = l.indexOf("=");
                return [l.slice(0, i), l.slice(i + 1)];
              }));
              const base = readFields(process.env.FLOW_BASE);
              const want = readFields(process.env.FLOW_WANT);
              const out = [];
              for (const [f, v] of readFields(process.env.FLOW_NOW)) {
                if (v === base.get(f) || v === want.get(f)) continue;
                out.push(f + " was " + base.get(f) + ", is now " + v + ", this run would write " + want.get(f));
              }
              process.stdout.write(out.join("; "));
            ')"
            if [ -n "$conflicts" ]; then
              echo "::error::flow: CONFLICTING EDIT — $task_file changed on main in a field $id -> $TRANSITION writes: $conflicts. Refusing to overwrite that change, so this transition was NOT applied."
              exit 1
            fi

            git add .flow/tasks/
            git commit -m "$COMMIT_MSG"
          done
          echo "$id -> $TRANSITION landed on main (attempt $attempt of $MAX_PUSH_ATTEMPTS)."
          # <<< flow-0059 state-push-retry <<<
