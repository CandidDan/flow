name: _flow-status (reusable)

# Reusable form of the PR-event status sync. Repos call it from a thin caller; the logic
# is authored once in canonical. See docs/flow-reusable-workflows.md.
#
# Event-driven state: the worker writes code and opens/closes PRs; PR events own the
# lifecycle transitions so frontmatter never needs hand-editing for them.
#   opened / reopened, DRAFT   -> stays in_progress (+ branch & pr recorded) — flow-0039;
#                                 a task already `blocked` stays blocked (flow-0169)
#   opened / reopened, ready   -> in_review (+ branch & pr recorded)
#   ready_for_review           -> in_review (the hand-off; a worker's `gh pr ready`)
#   closed without merge       -> back to ready (owner/branch/pr cleared for re-claim), one
#                                 model tier up (flow-0083: a closed PR is a failed attempt);
#                                 a task already `cancelled` is left exactly as it is (flow-0176)
#   closed by merge            -> handled by flow-done.yml (this job no-ops)
#   anything else              -> logged no-op (a caller pinned ahead of this reusable)
# Workers write only two transitions by hand: the claim (ready -> in_progress, which must
# stay an atomic first-push-wins commit) and blocked (a judgment call).

on:
  workflow_call:
    inputs:
      runner:
        description: "runs-on label for every job. Callers pass vars.FLOW_RUNNER; see docs/flow-reusable-workflows.md before choosing a non-GitHub runner."
        required: false
        type: string
        default: "ubuntu-latest"
      # GHES-ONLY FALLBACK for the `asks` job's canonical-helper fetch (flow-0120, ADR-0008). On
      # github.com `job.workflow_sha` resolves and this is never read — leave it unset. Never a
      # branch: the fetch step refuses a moving ref.
      flow_ref:
        description: "Fallback ref for canonical's helpers when job.workflow_sha is unavailable (GHES). A tag or a commit sha, never a branch."
        required: false
        type: string
        default: ""

# No top-level `permissions:` (flow-0120). Each job states its own or inherits the caller's:
#   sync-status  states `contents: write`, exactly what this file granted every job before.
#   asks         states nothing, so it inherits the caller's job grant. The synced caller grants
#                `contents: write`, `pull-requests: write` and `issues: write`. A caller that has
#                not been synced grants only `contents: write`, so its PR calls get a 403 and the
#                job ends green with a ::warning::.
# A top-level block here would cap BOTH jobs at it, and a job that REQUESTED the two new scopes
# would fail the whole run, sync-status included, in every repo whose caller has not been synced.

jobs:
  sync-status:
    # No branch-name gate: a cloud session forced onto a non-flow/ branch (e.g. claude/…) must
    # still transition. The id is resolved from the branch OR the PR title (CAN-52); the step
    # no-ops cleanly when neither carries one.
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      # check-latest (flow-0166): a major-line range alone takes the runner image's cached patch, which
      # trailed Node's 2026-10-21 security release by days (CVE-2026-111497). Resolve the latest patch.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          check-latest: true
          node-version: 22

      - name: Sync task state from the PR event
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ACTION:   ${{ github.event.action }}
          MERGED:   ${{ github.event.pull_request.merged }}
          PR_URL:   ${{ github.event.pull_request.html_url }}
          PR_NUM:   ${{ github.event.pull_request.number }}
          # flow-0039. Present on every `pull_request` event, so draft state needs no API call.
          DRAFT:    ${{ github.event.pull_request.draft }}
          # flow-0162: pr-of-record.mjs reads the record PR's state with `gh pr view`. Without a
          # token gh fails, the helper falls back to no-record, and the guard never fires.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Branch name first (canonical), PR title second (CAN-52 fallback for non-flow/ branches).
          # The job checks out `main`; the helper lives there once the repo adopts the template.
          # Guard its presence (so a bootstrap PR no-ops cleanly) and keep the call non-fatal under
          # set -e: any miss yields an empty id and the safe no-op below.
          id=""
          if [ -f .flow/bin/parse-task-id.mjs ]; then
            id="$(node .flow/bin/parse-task-id.mjs "$HEAD_REF" "$PR_TITLE" || true)"
          fi
          if [ -z "$id" ]; then echo "No task id in branch '$HEAD_REF' or title '$PR_TITLE' — nothing to sync."; exit 0; fi

          # flow-0162: a task that already has an OPEN PR of record ignores every other PR. `pr:` is
          # read from origin/main (the checkout is `main`, refreshed here), never from a PR branch.
          # Runs before any edit is written; a merge is flow-done's, so it is not checked here.
          if [ "$ACTION" != "closed" ] || [ "$MERGED" != "true" ]; then
            if [ -f .flow/bin/pr-of-record.mjs ]; then
              git fetch -q origin main
              rc=0
              node .flow/bin/pr-of-record.mjs --id "$id" --event-pr "$PR_NUM" --event "$ACTION" || rc=$?
              if [ "$rc" = "3" ]; then exit 0; fi
            fi
          fi

          # flow-0039: a DRAFT PR is not a hand-off. flow-open-pr fires on the first push, so a PR
          # existing says only "a branch was pushed" — it is `ready_for_review` that says the worker
          # is done. A draft therefore records `branch` + `pr` (genuinely new information, and
          # earlier than the store used to get it) while leaving the task `in_progress`; the
          # in_review transition moves to the moment the draft is marked ready.
          case "$ACTION" in
            opened|reopened)
              # flow-0169: a worker that blocks commits `blocked` to main, and its branch push opens
              # this draft — the two race. Read the task's status from the store, and if it is
              # `blocked`, record only `branch` + `pr`: writing in_progress over a block hides it
              # from flow-unblock and makes its `touches` count as live overlap. The read is
              # status-transition.mjs's (flow-0176), shared with the `closed` guard below.
              cur_status=""
              if [ -f .flow/bin/status-transition.mjs ]; then
                cur_status="$(node .flow/bin/status-transition.mjs status --id "$id" || true)"
              fi
              if [ "$DRAFT" = "true" ] && [ "$cur_status" = "blocked" ]; then
                echo "PR #$PR_NUM opened as a draft -> $id stays blocked (branch + pr recorded)"
                TRANSITION="blocked (branch + pr recorded)"
                printf '{"updates":[{"id":"%s","branch":"%s","pr":"%s"}]}\n' \
                  "$id" "$HEAD_REF" "$PR_URL" > .flow/board-edits.json
              elif [ "$DRAFT" = "true" ]; then
                echo "PR #$PR_NUM opened as a draft -> $id stays in_progress (branch + pr recorded)"
                TRANSITION="in_progress (branch + pr recorded)"
                printf '{"updates":[{"id":"%s","status":"in_progress","branch":"%s","pr":"%s"}]}\n' \
                  "$id" "$HEAD_REF" "$PR_URL" > .flow/board-edits.json
              else
                echo "PR #$PR_NUM opened ready for review -> $id in_review"
                TRANSITION="in_review"
                printf '{"updates":[{"id":"%s","status":"in_review","branch":"%s","pr":"%s"}]}\n' \
                  "$id" "$HEAD_REF" "$PR_URL" > .flow/board-edits.json
              fi
              ;;
            ready_for_review)
              echo "PR #$PR_NUM marked ready for review -> $id in_review"
              TRANSITION="in_review"
              printf '{"updates":[{"id":"%s","status":"in_review","branch":"%s","pr":"%s"}]}\n' \
                "$id" "$HEAD_REF" "$PR_URL" > .flow/board-edits.json
              ;;
            closed)
              if [ "$MERGED" = "true" ]; then echo "Merged — flow-done owns this transition."; exit 0; fi
              TRANSITION="ready"
              # flow-0176: `cancelled` is terminal and only a human reverses it. The orchestrator
              # cancels a task and then closes its PR, so status-transition.mjs reads the task's
              # status first: a cancelled task gets no edit at all (exit 3), and keeps its owner,
              # branch and pr as the record of the PR it had. Otherwise it writes the reset edit.
              if [ -f .flow/bin/status-transition.mjs ]; then
                rc=0
                node .flow/bin/status-transition.mjs closed --id "$id" --event-pr "$PR_NUM" \
                  --edits .flow/board-edits.json || rc=$?
                if [ "$rc" = "3" ]; then exit 0; fi
                if [ "$rc" != "0" ]; then exit "$rc"; fi
              else
                echo "PR #$PR_NUM closed unmerged -> $id back to ready"
                printf '{"updates":[{"id":"%s","status":"ready","owner":"","branch":"","pr":""}]}\n' \
                  "$id" > .flow/board-edits.json
              fi
              ;;
            *)
              # An action this reusable does not model. Reachable whenever a caller is pinned to a
              # ref that lists a `types:` entry the reusable predates — exactly the `@v1` vs `@main`
              # skew flow-0033 hit — and without this branch the run would fall through to
              # apply-board-edits.mjs with no edits file written. Degrade to silence, not a crash.
              echo "PR #$PR_NUM: action '$ACTION' is not one this workflow transitions on — nothing to do."
              exit 0
              ;;
          esac

          # `apply-board-edits.mjs` CONSUMES the edits file, and the retry below re-derives this
          # edit against a fresh tip on every attempt — so keep the payload and the message.
          EDITS="$(cat .flow/board-edits.json)"
          COMMIT_MSG="flow: $id status sync ($ACTION, PR #$PR_NUM)"

          node .flow/bin/apply-board-edits.mjs

          # flow-0083, ESCALATION TRIGGER 2: a PR closed unmerged is a failed attempt, so the task
          # goes back to `ready` ONE MODEL TIER UP, in the same commit as the transition. `--once`
          # keys on this PR's event, so a second application is a no-op. A task the resolver
          # rejects keeps its transition: the reset to `ready` matters more than the model, and
          # flow-doctor fails that task's unreadable model loudly anyway.
          # The retry block below re-derives only `$EDITS`; if a contended push drops this edit,
          # the `Escalate the model` step after this one puts it back.
          if [ "$TRANSITION" = "ready" ] && [ -f .flow/bin/task-model.mjs ]; then
            node .flow/bin/task-model.mjs escalate --once --task-id "$id" --event "PR #$PR_NUM closed unmerged" \
              || echo "::warning::flow: $id went back to ready but its model was NOT escalated (see above)."
          fi

          if git diff --quiet -- .flow/tasks/; then
            echo "No state change for $id (no matching task file?) — nothing to commit."
            exit 0
          fi

          # >>> flow-0059 state-push-retry — byte-identical in _flow-status.yml and _flow-done.yml >>>
          # `main` is written constantly: a worker claiming, this workflow on a PR event,
          # flow-done on merge, flow-recover sweeping, and humans. A single `git push origin main`
          # therefore loses whenever anything else lands between this job's checkout and its push —
          # the transition is computed correctly, committed on the runner, refused with
          # `! [rejected] main -> main (fetch first)`, and then destroyed with the container. That is
          # not bad luck; concurrent writes are the normal case. Observed on run 35058472116, which
          # dropped flow-0056's `in_review` and needed a human to replay it.
          #
          # The shape is allocate-task-id.mjs's, for the identical race: DISCARD the attempt and REDO
          # it against the new tip. Deliberately absent: `pull`, `rebase`, `merge`, `--force` — each
          # of those COMBINES a stale edit with someone else's rather than re-deriving it, and a
          # rebase-then-push still loses inside the window between the rebase and the push.
          # Exhausting the attempts exits NON-ZERO naming the task and the transition: a state change
          # that vanishes quietly is the entire defect, so swallowing the last failure would rebuild
          # the bug with more code in front of it.
          MAX_PUSH_ATTEMPTS=5

          # The task file this run edits. Read off the diff rather than guessed from `$id`, so it is
          # exactly the file about to be committed.
          task_file="$(git diff --name-only -- .flow/tasks/ | head -1)"

          # flow-0114: the refusal below is per-FIELD, not per-blob. `apply-board-edits.mjs` patches
          # named frontmatter fields only, so an edit by another actor to a field this run does NOT
          # write — a worker's `notes:` entry, a widened `touches`, a body edit — cannot be lost by
          # re-applying: the retry re-derives from the new tip, which already carries it. Comparing
          # whole blobs called every one of those a conflict, and the commonest of them is on the
          # normal path of almost every task: a worker's last act is a handoff note on its own task
          # file on `main`, and marking the draft ready fires flow-status on the same file seconds
          # later. Observed on CandidDan/tanplan-platform#25 — the note and the status write touched
          # different fields and composed cleanly, and the transition was dropped anyway.
          #
          # So guard exactly the fields these edits write, and nothing else. `$EDITS` is the payload,
          # so the list is derived from it rather than restated per call site.
          written_fields="$(printf '%s\n' "$EDITS" | node -e '
            let s = ""; process.stdin.on("data", (d) => { s += d; }).on("end", () => {
              const keys = new Set();
              for (const u of JSON.parse(s).updates || []) {
                for (const k of Object.keys(u)) if (k !== "id") keys.add(k);
              }
              process.stdout.write([...keys].join(" ") + "\n");
            });')"

          # Read those fields out of a task file on stdin: one `<field>=<value>` line each, in a
          # fixed order, so two readings compare as plain text. Frontmatter only — a `status:` inside
          # the body is prose, not state. A field with no line reads `<absent>`, which is a value
          # worth comparing in its own right because apply-board-edits appends a missing field.
          FIELD_READER='
            const fields = process.argv[1].split(" ").filter(Boolean);
            let s = ""; process.stdin.on("data", (d) => { s += d; }).on("end", () => {
              const end = s.indexOf("\n---", 3);
              const head = end === -1 ? s : s.slice(0, end);
              for (const f of fields) {
                const m = head.match(new RegExp("^" + f + ":[ \\t]*(.*)$", "m"));
                process.stdout.write(f + "=" + (m ? m[1].trim() : "<absent>") + "\n");
              }
            });'
          base_fields="$(git show "HEAD:$task_file" | node -e "$FIELD_READER" "$written_fields")"
          echo "Guarding [$written_fields] of $task_file against concurrent edits; everything else in that file composes."

          git config user.name  "flow-bot"
          git config user.email "flow-bot@users.noreply.github.com"
          git add .flow/tasks/
          git commit -m "$COMMIT_MSG"

          attempt=1
          until git push origin HEAD:main; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$MAX_PUSH_ATTEMPTS" ]; then
              echo "::error::flow: LOST STATE CHANGE — $id -> $TRANSITION could not be pushed to main after $MAX_PUSH_ATTEMPTS attempts. $task_file on main is STALE and no other workflow will re-fire this transition. Re-run this workflow, or apply it by hand."
              exit 1
            fi

            # Throw our commit away and re-read `main`. A reset, not a pull: there is no local work
            # worth preserving, and the next attempt re-derives the edit from scratch.
            sleep "$attempt"
            git fetch origin main --quiet
            git reset --hard FETCH_HEAD

            # The guarded fields as the NEW tip has them. Read BEFORE re-applying, so this is the
            # other actor's state and not the one we are about to write over it.
            now_fields="$(git show "HEAD:$task_file" | node -e "$FIELD_READER" "$written_fields")"

            printf '%s\n' "$EDITS" > .flow/board-edits.json
            node .flow/bin/apply-board-edits.mjs

            if git diff --quiet -- .flow/tasks/; then
              echo "$id is already at '$TRANSITION' on main — someone else landed it. Nothing left to push."
              exit 0
            fi

            # Re-applying still changes the file, so the tip is not yet what this run wants. Whether
            # that is a CONFLICT depends on which field moved. A guarded field still reading as it did
            # at our starting tip is ours to write — the other actor changed something else, and that
            # something else is already in the tree we just re-applied onto, so it survives. A guarded
            # field another actor set to the value we would write is already landed. Anything else is
            # theirs, and pushing would erase it, which is worse than the drop this loop prevents.
            # Name the field and both values: the alternative is a human diffing two commits to find
            # out what collided.
            want_fields="$(node -e "$FIELD_READER" "$written_fields" < "$task_file")"
            conflicts="$(FLOW_BASE="$base_fields" FLOW_NOW="$now_fields" FLOW_WANT="$want_fields" node -e '
              const readFields = (v) => new Map((v || "").split("\n").filter(Boolean).map((l) => {
                const i = l.indexOf("=");
                return [l.slice(0, i), l.slice(i + 1)];
              }));
              const base = readFields(process.env.FLOW_BASE);
              const want = readFields(process.env.FLOW_WANT);
              const out = [];
              for (const [f, v] of readFields(process.env.FLOW_NOW)) {
                if (v === base.get(f) || v === want.get(f)) continue;
                out.push(f + " was " + base.get(f) + ", is now " + v + ", this run would write " + want.get(f));
              }
              process.stdout.write(out.join("; "));
            ')"
            if [ -n "$conflicts" ]; then
              echo "::error::flow: CONFLICTING EDIT — $task_file changed on main in a field $id -> $TRANSITION writes: $conflicts. Refusing to overwrite that change, so this transition was NOT applied."
              exit 1
            fi

            git add .flow/tasks/
            git commit -m "$COMMIT_MSG"
          done
          echo "$id -> $TRANSITION landed on main (attempt $attempt of $MAX_PUSH_ATTEMPTS)."
          # <<< flow-0059 state-push-retry <<<

      # flow-0083: the guarantee behind trigger 2. The step above escalates inside the transition's
      # own commit, but its retry block (byte-identical with _flow-done.yml) re-derives only the
      # board edits, so a push that lost a race lands `ready` WITHOUT the escalation. This step
      # re-reads `main` and applies it `--once`: on the normal path the event is already recorded
      # and this is a no-op; after a contended push it is the one commit that puts it back.
      - name: Escalate the model of a task whose PR closed unmerged
        if: ${{ github.event.action == 'closed' && github.event.pull_request.merged != true }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUM:   ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}   # flow-0162: pr-of-record.mjs's `gh pr view`, as above
        run: |
          if [ ! -f .flow/bin/task-model.mjs ] || [ ! -f .flow/bin/parse-task-id.mjs ]; then
            echo "No .flow/bin/task-model.mjs in this repo yet — no model escalation."
            exit 0
          fi
          id="$(node .flow/bin/parse-task-id.mjs "$HEAD_REF" "$PR_TITLE" || true)"
          if [ -z "$id" ]; then echo "No task id — nothing to escalate."; exit 0; fi
          event="PR #$PR_NUM closed unmerged"
          # flow-0162: same foreign-PR guard as the transition step — a stray PR closing must not
          # escalate a task whose PR of record is still open.
          if [ -f .flow/bin/pr-of-record.mjs ]; then
            git fetch -q origin main
            rc=0
            node .flow/bin/pr-of-record.mjs --id "$id" --event-pr "$PR_NUM" --event closed || rc=$?
            if [ "$rc" = "3" ]; then exit 0; fi
          fi
          git config user.name  "flow-bot"
          git config user.email "flow-bot@users.noreply.github.com"
          attempt=1
          while :; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            # flow-0176: a cancelled task's model is not raised. Read on every attempt, from the
            # tip just reset to, with the same decision the transition step used.
            if [ -f .flow/bin/status-transition.mjs ]; then
              rc=0
              node .flow/bin/status-transition.mjs closed --id "$id" --event-pr "$PR_NUM" || rc=$?
              if [ "$rc" = "3" ]; then exit 0; fi
            fi
            if ! node .flow/bin/task-model.mjs escalate --once --task-id "$id" --event "$event"; then
              echo "::warning::flow: $id's model could not be escalated after $event (see above)."
              exit 0
            fi
            if git diff --quiet -- .flow/tasks/; then
              echo "$id: escalation after $event is on main."
              exit 0
            fi
            git add .flow/tasks/
            git commit -q -m "flow: $id escalate model ($event)"
            if git push -q origin HEAD:main; then
              echo "$id: escalation after $event landed on main (attempt $attempt)."
              exit 0
            fi
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 5 ]; then
              echo "::error::flow: $id went back to ready but its model escalation after $event could not be pushed to main after 5 attempts."
              exit 1
            fi
            sleep "$attempt"
          done

  # flow-0120. A PR whose task has open `asks` tells the repo owner, where they already are: one
  # new comment that @-mentions them for every ask not announced on this PR before, and the
  # `needs-input` label while the task has any ask. Draft PRs included: a worker that blocks opens
  # its PR as a draft, and its `decision` ask is exactly what the owner must see.
  #
  # Ask text is written by a worker into the task file, so it is untrusted text. It reaches GitHub
  # only through a file (`--body-file`-style `-F body=@…`), never through a `run:` line, and the
  # renderer escapes it so it shows literally and can mention nobody.
  #
  # Every GitHub call here is best effort. A failure is a ::warning:: and the job stays green: the
  # status transition above is the part that must not fail, and it does not depend on this job.
  asks:
    if: >-
      github.event.action == 'opened' || github.event.action == 'reopened' ||
      github.event.action == 'ready_for_review'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 1

      # check-latest (flow-0166): a major-line range alone takes the runner image's cached patch, which
      # trailed Node's 2026-10-21 security release by days (CVE-2026-111497). Resolve the latest patch.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          check-latest: true
          node-version: 22

      # The renderer is canonical's, fetched at this workflow's own commit, so a repo that has
      # never synced still has it. Copied from `_flow-gates.yml`; only the `for helper in` line
      # differs, and `asks-comment.test.mjs` pins that.
      - name: Materialise canonical's helpers at this workflow's commit
        env:
          # `job.workflow_sha` / `job.workflow_repository` describe THE FILE THAT DEFINES THIS JOB
          # — this reusable — where `github.workflow_sha` describes the caller's 3-line caller and
          # `github.job_workflow_sha` is not exposed as an expression at all. Both job properties
          # are absent on GitHub Enterprise Server; `flow_ref` is the fallback for that case only,
          # and its race is recorded in docs/adr/0008-helpers-from-canonical.md.
          FLOW_WORKFLOW_REPO: ${{ job.workflow_repository }}
          FLOW_WORKFLOW_SHA: ${{ job.workflow_sha }}
          FLOW_REF_INPUT: ${{ inputs.flow_ref }}
        run: |
          set -euo pipefail
          repo="${FLOW_WORKFLOW_REPO:-}"
          ref="${FLOW_WORKFLOW_SHA:-}"
          src="job.workflow_sha"
          if [ -z "$ref" ]; then
            src="flow_ref input"
            ref="${FLOW_REF_INPUT:-}"
          fi
          [ -n "$repo" ] || repo="CandidDan/flow"
          if [ -z "$ref" ]; then
            echo "::error::Cannot resolve the commit of this reusable workflow: job.workflow_sha is"
            echo "::error::empty (expected only on GitHub Enterprise Server) and no flow_ref input"
            echo "::error::was passed. Set flow_ref in your flow-gates.yml caller to the same ref"
            echo "::error::its uses: pins. See docs/adr/0008-helpers-from-canonical.md."
            exit 1
          fi
          case "$repo" in
            */*) ;;
            *) echo "::error::Refusing canonical repo '$repo' — expected owner/repo."; exit 1 ;;
          esac
          case "$ref" in
            main|master|HEAD|refs/heads/*)
              echo "::error::Refusing to fetch the gate's helpers from the moving ref '$ref'. A"
              echo "::error::gate that follows a branch cannot be reproduced from a run log. Pass"
              echo "::error::flow_ref as a tag or a commit sha."
              exit 1 ;;
            -*) echo "::error::Invalid ref '$ref' — a ref cannot begin with '-'."; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/flow-canonical"
          rm -rf "$dir"
          mkdir -p "$dir"
          git -C "$dir" init -q
          git -C "$dir" remote add origin "https://github.com/$repo.git"
          git -C "$dir" config core.sparseCheckout true
          printf 'project-template/.flow/bin/\n' > "$dir/.git/info/sparse-checkout"
          git -C "$dir" fetch -q --depth 1 origin "$ref"
          git -C "$dir" checkout -q FETCH_HEAD
          bin="$dir/project-template/.flow/bin"
          for helper in asks-comment.mjs asks.mjs flow-doctor.mjs; do
            if [ -f "$bin/$helper" ]; then continue; fi
            echo "::error::$repo@$ref carries no project-template/.flow/bin/$helper. That is"
            echo "::error::canonical's own tree at the commit this workflow was resolved from, so"
            echo "::error::it is a bug in canonical, not in this repository."
            exit 1
          done
          echo "flow-helpers: decision=materialised repo=$repo ref=$ref source=$src bin=$bin"
          echo "FLOW_BIN=$bin" >> "$GITHUB_ENV"

      - name: Announce the task's asks on the PR
        env:
          HEAD_REF:   ${{ github.event.pull_request.head.ref }}
          PR_TITLE:   ${{ github.event.pull_request.title }}
          PR_NUM:     ${{ github.event.pull_request.number }}
          REPO:       ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          GH_TOKEN:   ${{ github.token }}
        run: |
          # The task id the same way sync-status resolves it: branch first, PR title second, from
          # THIS repo's own parse-task-id.mjs, which knows this repo's id prefix.
          id=""
          if [ -f .flow/bin/parse-task-id.mjs ]; then
            id="$(node .flow/bin/parse-task-id.mjs "$HEAD_REF" "$PR_TITLE" || true)"
          fi
          if [ -z "$id" ]; then echo "No task id in branch '$HEAD_REF' or title '$PR_TITLE' — no asks to announce."; exit 0; fi

          warn() { echo "::warning::flow-asks: $1 (PR #$PR_NUM, task $id). Is issues: write and pull-requests: write granted on the caller's flow-status job?"; }

          comments="$RUNNER_TEMP/flow-asks-comments.jsonl"
          body="$RUNNER_TEMP/flow-asks-body.md"
          if ! gh api --paginate "repos/$REPO/issues/$PR_NUM/comments" \
               --jq '.[] | {body: .body, user: .user.login} | @json' > "$comments"; then
            warn "could not read this PR's earlier comments, so no ask was announced"
            exit 0
          fi

          plan="$(node "$FLOW_BIN/asks-comment.mjs" plan --tasks-dir .flow/tasks --id "$id" \
            --owner "$REPO_OWNER" --comments "$comments" --body-out "$body")"
          echo "$plan"
          has_asks="$(printf '%s\n' "$plan" | sed -n 's/^has_asks=//p')"
          post="$(printf '%s\n' "$plan" | sed -n 's/^post=//p')"

          if [ "$post" = "true" ]; then
            if gh api -X POST "repos/$REPO/issues/$PR_NUM/comments" -F "body=@$body" > /dev/null; then
              echo "flow-asks: posted a comment for $id on PR #$PR_NUM"
            else
              warn "could not post the asks comment"
            fi
          fi

          if [ "$has_asks" = "true" ]; then
            gh label create needs-input --color d93f0b \
              --description "A Flow task on this PR has an open ask for a person" --force > /dev/null \
              || warn "could not create the needs-input label"
            gh api -X POST "repos/$REPO/issues/$PR_NUM/labels" -f "labels[]=needs-input" > /dev/null \
              || warn "could not add the needs-input label"
          else
            # A 404 here means the label was not on the PR, which is the state we want.
            gh api -X DELETE "repos/$REPO/issues/$PR_NUM/labels/needs-input" > /dev/null 2>&1 || true
            echo "flow-asks: $id has no open asks; needs-input is not on PR #$PR_NUM"
          fi
