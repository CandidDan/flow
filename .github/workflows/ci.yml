name: ci

# Canonical-repo CI. The repo's other workflows are all reusable (on: workflow_call), so they
# never run here — nothing was validating the Flow tooling that consuming repos adopt by
# reference. This runs the template's `.flow/bin` proving tests on every push/PR, so the bin
# (and the reusable workflows that call it) can't ship broken from canonical.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test the Flow tooling
        run: node --test project-template/.flow/bin/*.test.mjs
