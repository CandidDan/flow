name: Deploy Supabase edge functions

# Deploys only the functions whose source changed on push to main.
# If supabase/config.toml changes, ALL functions redeploy so verify_jwt
# and other per-function settings land consistently.
#
# Required secrets (set in GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — personal access token from
#     https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID   — "tmumzynxvnlbaleplglb" (the Nudge project ref)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:
    inputs:
      redeploy_all:
        description: "Redeploy all functions regardless of diff"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with previous commit for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determine functions to deploy
        id: changes
        run: |
          set -euo pipefail

          functions_dir="supabase/functions"
          all_functions=$(ls -1 "$functions_dir" | grep -v '^_' | grep -v '^\.')

          # Workflow dispatch override, or config.toml changed → redeploy all.
          if [[ "${{ github.event.inputs.redeploy_all }}" == "true" ]]; then
            echo "reason=manual redeploy_all input" >&2
            targets="$all_functions"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
                | grep -qE '^supabase/config\.toml$'; then
            echo "reason=config.toml changed" >&2
            targets="$all_functions"
          else
            echo "reason=diff against previous commit" >&2
            targets=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
              | grep -oE '^supabase/functions/[^/]+' \
              | sed 's|supabase/functions/||' \
              | grep -v '^_' \
              | sort -u \
              || true)
          fi

          if [[ -z "$targets" ]]; then
            echo "No function changes detected — nothing to deploy."
            echo "targets=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Deploying:"
          echo "$targets"
          # Collapse to space-separated for the next step
          echo "targets=$(echo $targets | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Deploy functions
        if: steps.changes.outputs.targets != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for fn in ${{ steps.changes.outputs.targets }}; do
            echo "::group::Deploy $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_ID"
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          if [[ -z "${{ steps.changes.outputs.targets }}" ]]; then
            echo "No functions deployed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deployed: ${{ steps.changes.outputs.targets }}" >> "$GITHUB_STEP_SUMMARY"
          fi
