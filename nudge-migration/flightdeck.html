<div id="fd">
<style>
  :root{ color-scheme: light; }
  #fd{ font-family: ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; color:#1c1a17; background:#faf8f4; padding:18px 18px 28px; }
  #fd h1{ font-size:20px; margin:0 0 2px; letter-spacing:-.01em; }
  #fd .sub{ color:#7a7268; font-size:12.5px; margin-bottom:16px; }
  #fd .needs{ border:1px solid #e7c98a; background:#fdf6e6; border-radius:12px; padding:12px 14px; margin-bottom:16px; }
  #fd .needs h2{ font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:#9a7b2e; margin:0 0 8px; }
  #fd .needs .clear{ color:#3f7a4a; font-size:13.5px; }
  #fd .cols{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; align-items:start; }
  #fd .col{ background:#fff; border:1px solid #ece7df; border-radius:12px; padding:10px; min-height:60px; }
  #fd .col h3{ font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; margin:2px 4px 10px; display:flex; justify-content:space-between; color:#6a6258; }
  #fd .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle; }
  #fd .card{ background:#fcfbf8; border:1px solid #ece7df; border-left:3px solid #c9c1b4; border-radius:9px; padding:8px 9px; margin-bottom:8px; }
  #fd .card .id{ font-size:10.5px; color:#8a8276; font-variant-numeric:tabular-nums; }
  #fd .card .t{ font-size:12px; line-height:1.32; margin-top:2px; }
  #fd .card a{ color:#2f6f9f; text-decoration:none; font-size:11px; }
  #fd .empty{ color:#aaa298; font-size:11px; text-align:center; padding:8px 0; font-style:italic; }
  #fd .foot{ color:#9a9288; font-size:11px; margin-top:16px; line-height:1.5; }
  #fd .p1{border-left-color:#cf6b5a} #fd .p2{border-left-color:#e0992f} #fd .p3{border-left-color:#c7b46f} #fd .p4{border-left-color:#8a9a7e}
</style>
<h1>Flow flightdeck &mdash; Nudge</h1>
<div class="sub" id="stamp"></div>

<div class="needs">
  <h2>Needs you now</h2>
  <div id="needs"></div>
</div>

<div class="cols" id="cols"></div>

<div class="foot">
  Snapshot of the <code>.flow/tasks/</code> store. Source of truth is the repo; this is a rendered
  view. Auto-refresh across projects becomes live once the GitHub connector is wired &mdash; until
  then it's refreshed on change. Merge is yours; everything between runs on its own.
</div>

<script>
const TASKS = [
  {id:"CAN-29", status:"ready",       priority:4, title:"Enable prompt caching on classify/extract/process-inbound", pr:""},
  {id:"CAN-30", status:"done",        priority:1, title:"Slim CLAUDE.md under the context budget", pr:"https://github.com/CandidDan/Nudge/pull/90"},
  {id:"CAN-31", status:"done",        priority:3, title:"Sync Flow template hardening into Nudge", pr:"https://github.com/CandidDan/Nudge/pull/95"},
  {id:"CAN-32", status:"ready",       priority:2, title:"Gate edge functions: deno check (+ boot smoke)", pr:""},
  {id:"CAN-33", status:"ready",       priority:3, title:"Adopt the gate-coverage floor (source_roots)", pr:""},
  {id:"CAN-34", status:"ready",       priority:4, title:"Adopt the queue-runner + board 'Work this' trigger", pr:""},
];
const COLS = [["ready","Ready","#6fa8c7"],["in_progress","In progress","#e0992f"],["in_review","In review","#9b86c4"],["blocked","Blocked","#cf6b5a"],["done","Done","#7fae6b"]];
const card = t => `<div class="card p${t.priority}"><div class="id">${t.id} &middot; P${t.priority}</div><div class="t">${t.title}</div>${t.pr?`<a href="${t.pr}" target="_blank" rel="noopener">PR &nearr;</a>`:""}</div>`;
document.getElementById("stamp").innerHTML = "snapshot &middot; " + new Date().toLocaleString();
const cols = document.getElementById("cols");
cols.innerHTML = COLS.map(([k,label,c])=>{
  const items = TASKS.filter(t=>t.status===k).sort((a,b)=>a.priority-b.priority);
  return `<div class="col"><h3><span><span class="dot" style="background:${c}"></span>${label}</span><span>${items.length}</span></h3>${items.map(card).join("")||'<div class="empty">&mdash;</div>'}</div>`;
}).join("");
const needs = TASKS.filter(t=>t.status==="in_review"||t.status==="blocked");
document.getElementById("needs").innerHTML = needs.length
  ? needs.map(card).join("")
  : `<div class="clear">&check; All clear &mdash; nothing in review or blocked. ${TASKS.filter(t=>t.status==="ready").length} ready in the queue.</div>`;
</script>
</div>
